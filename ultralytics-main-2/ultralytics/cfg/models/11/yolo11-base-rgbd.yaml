# Parameters
nc: 1 # number of classes (Apple Amodal)
channels: 4 # RGBD 输入：RGB(3ch) + Depth(1ch)
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # 保留原始 4ch 输入
  - [-1, 1, nn.Identity, []]            # 0 - 原始输入 (B, 4, 640, 640)

  # ================= RGB 流 (标准 YOLO11 逐级下采样) =================
  - [0, 1, SplitChannels, [[0, 1, 2]]]  # 1 - SplitRGB → (B, 3, 640, 640)
  - [-1, 1, Conv, [64, 3, 2]]           # 2 - P1/2 (320x320)
  - [-1, 1, Conv, [128, 3, 2]]          # 3 - P2/4 (160x160)
  - [-1, 1, C3k2, [256, False, 0.25]]   # 4 - 特征提取 (160x160)
  - [-1, 1, Conv, [256, 3, 2]]          # 5 - P3/8 (80x80)
  - [-1, 1, C3k2, [512, False, 0.25]]   # 6 - 特征提取 (80x80)
  - [-1, 1, Conv, [512, 3, 2]]          # 7 - P4/16 (40x40)
  - [-1, 1, C3k2, [512, False, 0.25]]   # 8 - 特征提取 (40x40)
  - [-1, 1, Conv, [1024, 3, 2]]         # 9 - P5/32 (20x20)  ←【补齐这一层下采样】
  - [-1, 1, C3k2, [1024, True]]         # 10 - 特征提取 (20x20) ←【补齐这一层特征提取】

  # ================= Depth 流 (轻量化对齐) =================
  - [0, 1, SplitChannels, [[3]]]        # 11 - SplitDepth → (B, 1, 640, 640)
  - [-1, 1, Conv, [16, 3, 2]]           # 12 - P1/2 (320x320)
  - [-1, 1, Conv, [32, 3, 2]]           # 13 - P2/4 (160x160)
  - [-1, 1, Conv, [64, 3, 2]]           # 14 - P3/8 (80x80)
  - [-1, 1, Conv, [128, 3, 2]]          # 15 - P4/16 (40x40)
  - [-1, 1, Conv, [256, 3, 2]]          # 16 - P5/32 (20x20) ←【深度流同步下采样到20x20】

  # ================= 基础无损融合 (Bypass 拼接) =================
  - [[6, 14], 1, BypassModule, []]      # 17 - F_P3 (80x80)
  - [[8, 15], 1, BypassModule, []]      # 18 - F_P4 (40x40)
  - [[10, 16], 1, BypassModule, []]     # 19 - F_P5 (20x20)

head:
  - [19, 1, SPPF, [1024, 5]]            # 20 - 接收 F_P5 (20x20)
  - [-1, 1, C2PSA, [1024]]              # 21 - 此时自注意力在 20x20 上安全计算
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 22 (20x20 → 40x40)
  - [[-1, 18], 1, Concat, [1]]          # 23 融合 F_P4
  - [-1, 1, C3k2, [512, False]]         # 24

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 25 (40x40 → 80x80)
  - [[-1, 17], 1, Concat, [1]]          # 26 融合 F_P3
  - [-1, 1, C3k2, [256, False]]         # 27 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]          # 28 (80x80 → 40x40)
  - [[-1, 24], 1, Concat, [1]]          # 29 融合 Head P4
  - [-1, 1, C3k2, [512, False]]         # 30 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]          # 31 (40x40 → 20x20)
  - [[-1, 21], 1, Concat, [1]]          # 32 融合 Head P5
  - [-1, 1, C3k2, [1024, False]]         # 33 (P5/32-large)

  - [[27, 30, 33], 1, Segment, [nc, 32, 256]]  # 34 检测与分割输出