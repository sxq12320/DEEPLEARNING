# Ultralytics YOLO11-seg with XX-Former RGBD Dual-Backbone
# Architecture: RGB (main) + Depth (auxiliary) dual-stream encoder
# RGB: standard CNN downsampling + C3k2_XXFormer (global+local features)
# Depth: pooling-based downsampling (lightweight, edge-focused)
# Fusion: Depth assists RGB at each feature level

# Parameters
nc: 1 # number of classes
ch: 4 # RGBD input: RGB(3ch) + Depth(1ch)
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, nn.Identity, []]                    # 0 - original input (B, 4, 640, 640)

  # ================= RGB Stream (Main Backbone) =================
  # Standard CNN downsampling + C3k2_XXFormer for feature extraction
  - [0, 1, SplitChannels, [[0, 1, 2]]]          # 1 - SplitRGB → (B, 3, 640, 640)
  - [-1, 1, Conv, [64, 3, 2]]                   # 2 - P1/2 (320x320)
  - [-1, 1, Conv, [128, 3, 2]]                  # 3 - P2/4 (160x160)
  - [-1, 1, C3k2_XXFormer, [256, 0.25]]         # 4 - XX-Former feature extraction (160x160)
  - [-1, 1, Conv, [256, 3, 2]]                  # 5 - P3/8 (80x80)
  - [-1, 1, C3k2_XXFormer, [512, 0.25]]         # 6 - XX-Former feature extraction (80x80)
  - [-1, 1, Conv, [512, 3, 2]]                  # 7 - P4/16 (40x40)
  - [-1, 1, C3k2_XXFormer, [512, 0.25]]         # 8 - XX-Former feature extraction (40x40)
  - [-1, 1, Conv, [1024, 3, 2]]                 # 9 - P5/32 (20x20)
  - [-1, 1, C3k2_XXFormer, [1024]]              # 10 - XX-Former feature extraction (20x20)

  # ================= Depth Stream (Auxiliary Backbone) =================
  # Pooling-based downsampling (lightweight, edge-focused)
  - [0, 1, SplitChannels, [[3]]]                # 11 - SplitDepth → (B, 1, 640, 640)
  - [-1, 1, Conv, [16, 3, 2]]                   # 12 - P1/2 (320x320)
  - [-1, 1, nn.MaxPool2d, [2, 2]]               # 13 - P2/4 (160x160) ← MaxPool preserves edges
  - [-1, 1, Conv, [32, 1, 1]]                   # 14 - channel alignment (160x160)
  - [-1, 1, nn.MaxPool2d, [2, 2]]               # 15 - P3/8 (80x80)
  - [-1, 1, Conv, [64, 1, 1]]                   # 16 - channel alignment (80x80)
  - [-1, 1, nn.MaxPool2d, [2, 2]]               # 17 - P4/16 (40x40)
  - [-1, 1, Conv, [128, 1, 1]]                  # 18 - channel alignment (40x40)
  - [-1, 1, nn.MaxPool2d, [2, 2]]               # 19 - P5/32 (20x20)
  - [-1, 1, Conv, [256, 1, 1]]                  # 20 - channel alignment (20x20)

  # ================= Depth-Assists-RGB Fusion =================
  # NeckGateFusion: Depth features modulate RGB features
  - [[6, 16], 1, NeckGateFusion, []]            # 21 - F_P3 (80x80): RGB + Depth
  - [[8, 18], 1, NeckGateFusion, []]            # 22 - F_P4 (40x40): RGB + Depth
  - [[10, 20], 1, NeckGateFusion, []]           # 23 - F_P5 (20x20): RGB + Depth

head:
  - [23, 1, SPPF, [1024, 5]]                    # 24 - SPPF on fused P5 (20x20)
  - [-1, 1, C2PSA, [1024]]                      # 25 - self-attention (20x20)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 26 (20x20 → 40x40)
  - [[-1, 22], 1, Concat, [1]]                  # 27 - fuse with F_P4
  - [-1, 1, C3k2_XXFormer, [512, 0.25]]         # 28 - XX-Former refinement

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 29 (40x40 → 80x80)
  - [[-1, 21], 1, Concat, [1]]                  # 30 - fuse with F_P3
  - [-1, 1, C3k2_XXFormer, [256, 0.25]]         # 31 - XX-Former refinement (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                  # 32 (80x80 → 40x40)
  - [[-1, 28], 1, Concat, [1]]                  # 33 - fuse with head P4
  - [-1, 1, C3k2_XXFormer, [512, 0.25]]         # 34 - XX-Former refinement (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                  # 35 (40x40 → 20x20)
  - [[-1, 25], 1, Concat, [1]]                  # 36 - fuse with head P5
  - [-1, 1, C3k2_XXFormer, [1024]]              # 37 - XX-Former refinement (P5/32)

  - [[31, 34, 37], 1, Segment, [nc, 32, 256]]   # 38 - detection & segmentation output
