# Ultralytics YOLO11-seg with XX-Former RGBD 双主干网络
# 架构：RGB（主） + Depth（辅）双流编码器
# RGB：标准 CNN 下采样 + C3k2_XXFormer（全局+局部特征）
# Depth：基于池化的下采样（轻量、边缘导向）
# 融合：Depth 在每个特征层级辅助 RGB

# 参数
nc: 1 # 类别数
ch: 4 # RGBD 输入：RGB(3通道) + Depth(1通道)
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, nn.Identity, []]                    # 0 - 原始输入 (B, 4, 640, 640)

  # ================= RGB 流（主干网络） =================
  # 标准 CNN 下采样 + C3k2_XXFormer 特征提取
  - [0, 1, SplitChannels, [[0, 1, 2]]]          # 1 - 分离RGB → (B, 3, 640, 640)
  - [-1, 1, Conv, [64, 3, 2]]                   # 2 - P1/2 (320x320)
  - [-1, 1, Conv, [128, 3, 2]]                  # 3 - P2/4 (160x160)
  - [-1, 1, C3k2_XXFormer, [256, 0.25]]         # 4 - XX-Former 特征提取 (160x160)
  - [-1, 1, Conv, [256, 3, 2]]                  # 5 - P3/8 (80x80)
  - [-1, 1, C3k2_XXFormer, [512, 0.25]]         # 6 - XX-Former 特征提取 (80x80)
  - [-1, 1, Conv, [512, 3, 2]]                  # 7 - P4/16 (40x40)
  - [-1, 1, C3k2_XXFormer, [512, 0.25]]         # 8 - XX-Former 特征提取 (40x40)
  - [-1, 1, Conv, [1024, 3, 2]]                 # 9 - P5/32 (20x20)
  - [-1, 1, C3k2_XXFormer, [1024]]              # 10 - XX-Former 特征提取 (20x20)

  # ================= 深度流（辅助骨干） =================
  # 基于池化的下采样（轻量、边缘导向）
  - [0, 1, SplitChannels, [[3]]]                # 11 - 分离Depth → (B, 1, 640, 640)
  - [-1, 1, Conv, [16, 3, 2]]                   # 12 - P1/2 (320x320)
  - [-1, 1, nn.MaxPool2d, [2, 2]]               # 13 - P2/4 (160x160) ← MaxPool 保留边缘
  - [-1, 1, Conv, [32, 1, 1]]                   # 14 - 通道对齐 (160x160)
  - [-1, 1, nn.MaxPool2d, [2, 2]]               # 15 - P3/8 (80x80)
  - [-1, 1, Conv, [64, 1, 1]]                   # 16 - 通道对齐 (80x80)
  - [-1, 1, nn.MaxPool2d, [2, 2]]               # 17 - P4/16 (40x40)
  - [-1, 1, Conv, [128, 1, 1]]                  # 18 - 通道对齐 (40x40)
  - [-1, 1, nn.MaxPool2d, [2, 2]]               # 19 - P5/32 (20x20)
  - [-1, 1, Conv, [256, 1, 1]]                  # 20 - 通道对齐 (20x20)

  # ================= 深度辅助RGB融合 =================
  # NeckGateFusion：深度特征调制 RGB 特征
  - [[6, 16], 1, NeckGateFusion, []]            # 21 - F_P3 (80x80): RGB + Depth
  - [[8, 18], 1, NeckGateFusion, []]            # 22 - F_P4 (40x40): RGB + Depth
  - [[10, 20], 1, NeckGateFusion, []]           # 23 - F_P5 (20x20): RGB + Depth

head:
  - [23, 1, SPPF, [1024, 5]]                    # 24 - 融合P5上的SPPF (20x20)
  - [-1, 1, C2PSA, [1024]]                      # 25 - 自注意力 (20x20)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 26 (20x20 → 40x40)
  - [[-1, 22], 1, Concat, [1]]                  # 27 - 与 F_P4 融合
  - [-1, 1, C3k2_XXFormer, [512, 0.25]]         # 28 - XX-Former 精炼

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 29 (40x40 → 80x80)
  - [[-1, 21], 1, Concat, [1]]                  # 30 - 与 F_P3 融合
  - [-1, 1, C3k2_XXFormer, [256, 0.25]]         # 31 - XX-Former 精炼 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                  # 32 (80x80 → 40x40)
  - [[-1, 28], 1, Concat, [1]]                  # 33 - 与 head P4 融合
  - [-1, 1, C3k2_XXFormer, [512, 0.25]]         # 34 - XX-Former 精炼 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                  # 35 (40x40 → 20x20)
  - [[-1, 25], 1, Concat, [1]]                  # 36 - 与 head P5 融合
  - [-1, 1, C3k2_XXFormer, [1024]]              # 37 - XX-Former 精炼 (P5/32)

  - [[31, 34, 37], 1, Segment, [nc, 32, 256]]   # 38 - 检测 & 分割输出
