# 消融实验 6：完整魔改模型 (所有改进组合)
# 改进策略：组合所有改进模块 — 双分支架构 + ShuffleNetV2 + CT融合 + 优化器
# 训练命令示例：
#   PIDAO优化器: yolo segment train model=ablation6_full_model.yaml optimizer=PIDAO data=your_rgd_data.yaml epochs=100
#   SMC优化器:   yolo segment train model=ablation6_full_model.yaml optimizer=SMC data=your_rgd_data.yaml epochs=100
#   标准AdamW:   yolo segment train model=ablation6_full_model.yaml optimizer=AdamW data=your_rgd_data.yaml epochs=100
#
# 完整改进清单：
#   1. 四通道RGBD输入 (channels=4)
#   2. RGB分支: YOLO11标准架构
#   3. Depth分支: ShuffleNetV2 1.0x (Stem + Stage3 + Stage4)
#   4. CT控制理论融合:
#      - P3: KalmanGatedFusion (卡尔曼增益融合)
#      - P4: ESOFusion (自抗扰扰动补偿融合)
#      - P5: IDAPBCFusion (IDA-PBC能量成型融合)
#   5. 优化器: PIDAO(多通道高阶PID) 或 SMC(滑模控制AdamW)
#
# 建议运行3次实验对比优化器效果：
#   实验6a: optimizer=PIDAO
#   实验6b: optimizer=SMC
#   实验6c: optimizer=AdamW (对照)

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (标准 YOLO11) ==========
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2  (4ch输入)
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4-P3/8 RGB特征
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6-P4/16 RGB特征
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10-P5/32 RGB特征

  # ========== Depth 分支 (ShuffleNetV2 1.0x) ==========
  - [0, 1, ShuffleV2Stem_Depth, [24]]   # 11-Depth Stem: P1/2→P3/8, 24ch
  - [-1, 1, Conv, [116, 1, 1]]          # 12-Depth P3/8, 116ch
  - [-1, 1, ShuffleV2Stage, [232, 8]]   # 13-Depth P4/16, 232ch
  - [-1, 1, ShuffleV2Stage, [464, 4]]   # 14-Depth P5/32, 464ch

  # ========== CT 控制理论融合 (层级化) ==========
  - [[4, 12], 1, KalmanGatedFusion, []] # 15-P3: Kalman(RGB_P3, Depth_P3) → 512ch
  - [[6, 15], 1, ESOFusion, []]         # 16-P4: ESO(RGB_P4, Fused_P3) → 1024ch
  - [[10, 16], 1, IDAPBCFusion, []]     # 17-P5: IDAPBC(RGB_P5, Fused_P4) → 1024ch

# YOLO11 head (使用CT融合后的特征)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 16], 1, Concat, [1]]          # 19-cat ESO P4
  - [-1, 2, C3k2, [512, False]]         # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21
  - [[-1, 15], 1, Concat, [1]]          # 22-cat Kalman P3
  - [-1, 2, C3k2, [256, False]]         # 23-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]          # 24
  - [[-1, 20], 1, Concat, [1]]          # 25-cat head P4
  - [-1, 2, C3k2, [512, False]]         # 26-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]          # 27
  - [[-1, 17], 1, Concat, [1]]          # 28-cat IDAPBC P5
  - [-1, 2, C3k2, [1024, True]]         # 29-P5/32-large

  - [[23, 26, 29], 1, Segment, [nc, 32, 256]] # 30-Segment(P3, P4, P5)
