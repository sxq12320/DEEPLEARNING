# 消融实验 7：RGB分支(YOLO11) + Depth分支(ShuffleNetV2) + APFM预融合 + CT融合策略
# 改进策略：在 CT 融合模块之前增加 APFM (Attention Parallel Feature Mixer) 预融合
# 训练命令示例：
#   yolo segment train model=ablation7_apfm_ct_fusion.yaml data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 输入：4通道 RGBD (channels=4)
#   - RGB分支：标准YOLO11 backbone，输出P3/P4/P5
#   - Depth分支：ShuffleNetV2 1.0x，输出P3/P4/P5
#   - APFM 预融合（位于 CT 融合模块之前）：
#     · APFM 同时建模 Channel-wise 和 Spatial-wise 注意力
#     · 对两路互补特征进行自适应加权融合，生成注意力权重 w
#     · Ff = w * FA + (1 - w) * FB
#   - CT 控制理论融合（使用 APFM 输出作为输入）：
#     · P3浅层: APFM(RGB_P3, Depth_P3) → KalmanGatedFusion(RGB_P3, APFM_P3)
#     · P4中层: APFM(RGB_P4, APFM_P3) → ESOFusion(RGB_P4, APFM_P4)
#     · P5深层: APFM(RGB_P5, APFM_P4) → IDAPBCFusion(RGB_P5, APFM_P5)
#
# 融合层级关系（自底向上）：
#   APFM(RGB_P3, Depth_P3) → APFM_P3
#   APFM(RGB_P4, APFM_P3)  → APFM_P4
#   APFM(RGB_P5, APFM_P4)  → APFM_P5
#   KalmanGatedFusion(RGB_P3, APFM_P3) → Fused_P3
#   ESOFusion(RGB_P4, APFM_P4)         → Fused_P4
#   IDAPBCFusion(RGB_P5, APFM_P5)      → Fused_P5

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (标准 YOLO11) ==========
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2  (4ch输入)
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4-P3/8 RGB特征
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6-P4/16 RGB特征
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10-P5/32 RGB特征

  # ========== Depth 分支 (ShuffleNetV2 1.0x) ==========
  - [0, 1, ShuffleV2Stem_Depth, [24]]   # 11-Depth Stem: P1/2→P3/8, 24ch
  - [-1, 1, Conv, [116, 1, 1]]          # 12-Depth P3/8, 116ch
  - [-1, 1, ShuffleV2Stage, [232, 8]]   # 13-Depth P4/16, 232ch
  - [-1, 1, ShuffleV2Stage, [464, 4]]   # 14-Depth P5/32, 464ch

  # ========== APFM 预融合 (位于 CT 融合模块之前) ==========
  # APFM: Attention Parallel Feature Mixer，自适应加权融合两路特征
  - [[4, 12], 1, APFM, []]              # 15-APFM(RGB_P3, Depth_P3) → 512ch
  - [[6, 15], 1, APFM, []]              # 16-APFM(RGB_P4, APFM_P3) → 512ch
  - [[10, 16], 1, APFM, []]             # 17-APFM(RGB_P5, APFM_P4) → 1024ch

  # ========== CT 控制理论融合 (使用 APFM 输出作为输入) ==========
  # P3浅层: 卡尔曼增益融合 (第二路输入由 Depth_P3 替换为 APFM_P3)
  - [[4, 15], 1, KalmanGatedFusion, []] # 18-P3融合: Kalman(RGB_P3, APFM_P3) → 512ch
  # P4中层: ESO扰动补偿融合 (第二路输入由 Fused_P3 替换为 APFM_P4)
  - [[6, 16], 1, ESOFusion, []]         # 19-P4融合: ESO(RGB_P4, APFM_P4) → 1024ch
  # P5深层: IDA-PBC能量成型融合 (第二路输入由 Fused_P4 替换为 APFM_P5)
  - [[10, 17], 1, IDAPBCFusion, []]     # 20-P5融合: IDAPBC(RGB_P5, APFM_P5) → 1024ch

# YOLO11 head (使用CT融合后的特征)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21
  - [[-1, 19], 1, Concat, [1]]          # 22-cat ESO P4 (1024+1024=2048)
  - [-1, 2, C3k2, [512, False]]         # 23

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 24
  - [[-1, 18], 1, Concat, [1]]          # 25-cat Kalman P3 (512+512=1024)
  - [-1, 2, C3k2, [256, False]]         # 26-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]          # 27
  - [[-1, 23], 1, Concat, [1]]          # 28-cat head P4
  - [-1, 2, C3k2, [512, False]]         # 29-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]          # 30
  - [[-1, 20], 1, Concat, [1]]          # 31-cat IDAPBC P5
  - [-1, 2, C3k2, [1024, True]]         # 32-P5/32-large

  - [[26, 29, 32], 1, Segment, [nc, 32, 256]] # 33-Segment(P3, P4, P5)
