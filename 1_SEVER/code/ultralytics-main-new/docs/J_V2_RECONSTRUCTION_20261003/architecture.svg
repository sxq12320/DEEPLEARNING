<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1030" viewBox="0 0 1640 1030">
<title>Original J36 control: candidate discovery and constrained mask decoder</title>
<desc>Original J36 retained as a control. Its nearest x2 and pointwise prototype projection tie four sub-pixel phases. J41 fixes this with independently learnable phases. Native I-series validation remains unchanged. No recurrent feedback or sparsity implementation is depicted.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a;font-size:18px}
    .title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#475569}
    .h{font-size:23px;font-weight:700}.strong{font-weight:700}.small{font-size:15px}
    .line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#a)}
    .sem{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#b)}
    .dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#a)}
  </style>
</defs>
<rect width="1640" height="1030" fill="#fff"/>
<text x="46" y="51" class="title">J36 · Discovery–Decoding Budget Separation</text>
<text x="46" y="82" class="sub">旧J36对照：四相位复制缺陷已查明 / J41修复；精度与GPU速度仍待实验</text>

<rect x="35" y="115" width="495" height="580" rx="17" fill="#eff6ff" stroke="#93c5fd"/>
<rect x="552" y="115" width="304" height="580" rx="17" fill="#ecfdf5" stroke="#86efac"/>
<rect x="878" y="115" width="726" height="580" rx="17" fill="#f5f3ff" stroke="#c4b5fd"/>
<text x="55" y="150" class="h">1. 非CSP可合并编码器</text>
<text x="574" y="150" class="h">2. 短语义注入</text>
<text x="901" y="150" class="h">3. 薄候选头 + 分离的mask解码</text>

<rect x="60" y="192" width="145" height="70" rx="10" fill="#fff" stroke="#60a5fa"/>
<text x="82" y="220" class="strong">RGB · 640²</text><text x="78" y="246" class="small">保留颜色信息</text>
<path d="M205 227H252" class="line"/>
<rect x="254" y="183" width="240" height="87" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
<text x="271" y="212" class="strong">Conv stem · stride2 · 24ch</text>
<text x="271" y="237" class="small">+ 有界中心–周围对比残差</text>
<text x="271" y="258" class="small">x + 0.25 tanh(a) Q(x−local_mean)</text>

<rect x="254" y="300" width="240" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
<text x="273" y="327" class="strong">C2 · stride4 · 48ch</text><text x="273" y="353" class="small">Conv↓ + RepStage ×2</text>
<rect x="254" y="398" width="240" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
<text x="273" y="425" class="strong">C3 · stride8 · 96ch</text><text x="273" y="451" class="small">Conv↓ + RepStage ×3</text>
<rect x="254" y="496" width="240" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
<text x="273" y="523" class="strong">C4 · stride16 · 160ch</text><text x="273" y="549" class="small">Conv↓ + RepStage ×4</text>
<rect x="254" y="594" width="240" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
<text x="273" y="621" class="strong">C5 · stride32 · 224ch</text><text x="273" y="647" class="small">Conv↓ + RepStage ×2 + SPPF</text>
<path d="M374 270V299M374 370V397M374 468V495M374 566V593" class="line"/>
<text x="64" y="386" class="small">空间混合</text><text x="64" y="411" class="small">与通道混合分工</text>
<text x="64" y="450" class="small">P5仍提供语义</text><text x="64" y="475" class="small">不在P5预测候选</text>

<rect x="578" y="300" width="246" height="70" rx="10" fill="#d1fae5" stroke="#10b981"/>
<text x="596" y="327" class="strong">N2 · stride4 · 32ch</text><text x="596" y="353" class="small">Fuse(C2, N3) · 微果发现</text>
<rect x="578" y="398" width="246" height="70" rx="10" fill="#d1fae5" stroke="#10b981"/>
<text x="596" y="425" class="strong">N3 · stride8 · 64ch</text><text x="596" y="451" class="small">Fuse(C3, N4)</text>
<rect x="578" y="496" width="246" height="70" rx="10" fill="#d1fae5" stroke="#10b981"/>
<text x="596" y="523" class="strong">N4 · stride16 · 96ch</text><text x="596" y="549" class="small">Fuse(C4, C5)</text>
<path d="M494 335H577M494 433H577M494 531H577" class="line"/>
<path d="M494 629H540V580H699V567M700 496V469M700 398V371" class="sem"/>
<text x="578" y="615" class="small">低分辨率先投影，再上采样</text>
<text x="578" y="641" class="small">detail + 0.5 tanh(g) × semantics</text>
<text x="578" y="665" class="small">仅一次top-down，不反复PAN</text>

<rect x="927" y="288" width="302" height="212" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="947" y="322" class="strong">P2 / P3 / P4 候选预测</text>
<text x="947" y="353">各尺度1×1 adapter → 32ch</text>
<text x="947" y="383">两层3×3卷积：共享权重</text>
<text x="947" y="413">BN与输出层：分尺度</text>
<text x="947" y="447" class="small">box / class / 32 mask coefficients</text>
<text x="947" y="478" class="small">真正P2预测 ≠ 仅P2原型</text>
<path d="M824 335H926M824 433H926M824 531H902V482H926" class="line"/>
<rect x="927" y="561" width="302" height="104" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="946" y="590" class="strong">窄原型 · P3 → stride4</text>
<text x="946" y="618" class="small">1×1 → DW3×3 → ↑2 → 1×1</text>
<text x="946" y="646" class="small">旧限制：每个2×2子块logit相同</text>
<path d="M812 467V612H926" class="line"/>
<rect x="1300" y="389" width="263" height="150" rx="12" fill="#fff" stroke="#8b5cf6"/>
<text x="1320" y="423" class="strong">可见实例掩膜</text>
<text x="1320" y="454">σ(coefficients × proto)</text>
<text x="1320" y="484" class="small">原生NMS / crop / mask映射</text>
<text x="1320" y="514" class="small">不补圆、不填遮挡叶片</text>
<path d="M1229 394H1260V430H1299M1229 613H1260V499H1299" class="line"/>
<text x="1300" y="593" class="small">验证：仍为I系列EV6</text>
<text x="1300" y="619" class="small">共同input/2栅格、max_det300</text>
<text x="1300" y="645" class="small">未改AP积分或PR绘图规则</text>

<rect x="35" y="722" width="496" height="216" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="55" y="755" class="h">A. RepMix部署等价合并</text>
<text x="55" y="790">训练：DW3×3+BN / DW1×1+BN / BN</text>
<path d="M82 826H160" class="line"/>
<text x="178" y="832">冻结BN后相加 → 单个DW3×3</text>
<text x="55" y="872" class="small">块：spatial mix → 1×1扩张2倍 → 1×1 → residual</text>
<text x="55" y="906" class="small">等价性可证明；AP提升不可由合并公式保证</text>
<rect x="552" y="722" width="495" height="216" rx="14" fill="#fff7ed" stroke="#fdba74"/>
<text x="573" y="755" class="h">B. 训练与边界消融</text>
<text x="573" y="790">标准box / cls / DFL / mask训练保留</text>
<text x="573" y="824">+ 等实例tiny可见mask Dice · gain0.1</text>
<text x="573" y="862" class="small">J35→J36：只增加局部对比；J36→J38：容量压缩</text>
<text x="573" y="887" class="small">J37另加密度辅助监督；默认不运行额外凝视验证</text>
<text x="573" y="913" class="small">虚线含义为训练约束，不是循环反馈网络</text>
<rect x="1068" y="722" width="536" height="216" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1090" y="755" class="h">C. 成本与证据边界</text>
<text x="1090" y="790">J36：1.835M参数 / 9.693估计GFLOPs</text>
<text x="1090" y="824">J38：1.281M参数 / 7.459估计GFLOPs</text>
<text x="1090" y="862" class="small">batch1 / RGB640 / 未融合 / THOP；不是端到端耗时</text>
<text x="1090" y="887" class="small">CPU初测未证实更快；GPU吞吐和新数据精度待测</text>
<text x="1090" y="913" class="small">不把漂亮PR曲线当改进；看真实Rmax与误报</text>
<text x="45" y="982" class="sub">J_V2 structural reconstruction · 2026-10-03 · Proposed architecture, not a guaranteed best model</text>
</svg>
