   <g id="text_6">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(37.266141 85.89341)">C4 / C5</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(21.135867 94.861652)">1×1 projections</text>
   </g>
   <g id="text_7">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(122.682187 85.89341)">Mean + 3×3</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(117.153281 94.861652)">upsample to P2</text>
   </g>
   <g id="text_8">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(30.463992 143.19101)">P2 detail D</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(19.539187 152.159252)">semantic-guided</text>
   </g>
   <g id="text_9">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(118.209727 143.19101)">L = AvgPool(D)</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(127.490977 152.159252)">H = D − L</text>
   </g>
   <g id="text_10">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(227.175516 96.268598)">Gate: [S, L, |H|]</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(227.538797 105.445434)">1×1 → softmax</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(233.543484 114.413677)">w₁ + w₂ = 1</text>
   </g>
   <g id="text_11">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(341.166914 100.84061)">U = w₁(S − L)</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(334.98293 109.808852)">+ w₂ DWConv(H)</text>
   </g>
   <g id="text_12">
    <text style="fill: #203040; font: 7.2px 'DejaVu Sans'" transform="translate(454.78575 96.632437)">D′ = D</text>
    <text style="fill: #203040; font: 7.2px 'DejaVu Sans'" transform="translate(445.316625 105.24195)">+ tanh(a) U</text>
    <text style="fill: #203040; font: 7.2px 'DejaVu Sans'" transform="translate(441.2115 113.851463)">a starts at 0.1</text>
   </g>
   <g id="text_13">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(27.226898 251.55821)">P3 → 32 channels</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(30.969281 260.526452)">upsample to P2</text>
   </g>
   <g id="text_14">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(137.826844 251.55821)">Add projected D′</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(135.858094 260.526452)">16 → 32 channels</text>
   </g>
   <g id="text_15">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(248.770148 251.55821)">Depthwise 3×3</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(246.294562 260.526452)">+ pointwise 1×1</text>
   </g>
   <g id="text_16">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(359.098547 251.55821)">32 mask</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(364.244836 260.526452)">bases</text>
   </g>
   <g id="text_17">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(436.009594 251.55821)">Inherited phase</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(439.967602 260.526452)">refinement /2</text>
   </g>
   <g id="text_18">
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(30.852797 335.511689)">Tiny Dice: visible area &lt;256 px²</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(32.611195 344.479931)">mean mask coefficients per GT</text>
    <text style="fill: #203040; font: 7.5px 'DejaVu Sans'" transform="translate(29.887172 353.448173)">base BCE kept for every positive</text>
   </g>
