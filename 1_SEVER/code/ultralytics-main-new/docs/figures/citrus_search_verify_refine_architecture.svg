  <!-- Optional recheck, not part of base model -->
  <rect x="40" y="821" width="1719" height="119" rx="15" fill="#F8FAFC" stroke="#AAB7C1" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="58" y="839" width="268" height="28" rx="14" fill="#E9EFF3"/>
  <text x="73" y="858" font-family="Arial" font-size="13" font-weight="bold" fill="#526B7C">OPTIONAL SYSTEM-LEVEL PATH</text>
  <text x="59" y="897" font-family="Arial" font-size="17" font-weight="bold" fill="#3D596E">Native-resolution ROI recheck</text>
  <text x="59" y="923" font-family="Arial" font-size="13" fill="#657C8B">Only after measuring scout coverage; uniform slicing remains the recall/latency reference.</text>
  <rect x="793" y="851" width="258" height="68" rx="9" fill="#FFFFFF" stroke="#BCC9D1" stroke-width="1.4"/>
  <text x="922" y="880" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#3D596E">Budgeted native ROIs</text>
  <text x="922" y="902" text-anchor="middle" font-family="Arial" font-size="13" fill="#657C8B">coverage tested, not assumed</text>
  <rect x="1100" y="851" width="258" height="68" rx="9" fill="#FFFFFF" stroke="#BCC9D1" stroke-width="1.4"/>
  <text x="1229" y="880" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#3D596E">Same verifier + mask</text>
  <text x="1229" y="902" text-anchor="middle" font-family="Arial" font-size="13" fill="#657C8B">batched, bounded cost</text>
  <rect x="1407" y="851" width="323" height="68" rx="9" fill="#FFFFFF" stroke="#BCC9D1" stroke-width="1.4"/>
  <text x="1569" y="880" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#3D596E">Merge with global output</text>
  <text x="1569" y="902" text-anchor="middle" font-family="Arial" font-size="13" fill="#657C8B">report end-to-end time and FP</text>
  <path d="M1051 885H1097 M1358 885H1404" fill="none" stroke="#8799A6" stroke-width="2.7" stroke-dasharray="8 6"/>
