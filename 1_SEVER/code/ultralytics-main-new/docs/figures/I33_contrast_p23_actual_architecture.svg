  <rect x="42" y="35" width="7" height="65" rx="3" fill="#0072B2"/>
  <text x="70" y="68" font-family="Arial" font-size="32" font-weight="bold" fill="#17354D">I33 · Contrast P2/P3</text>
  <text x="71" y="98" font-family="Arial" font-size="17" fill="#5C7182">Actual model graph from I33_contrast_p23.yaml · RGB + luminance/local contrast · 3-scale instance segmentation</text>
