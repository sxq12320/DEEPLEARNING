  <!-- Footer: actual configuration, including absent proposed features -->
  <rect x="40" y="1000" width="1820" height="92" rx="13" fill="#F7FAFC" stroke="#C7D4DC" stroke-width="1.5"/>
  <text x="63" y="1030" font-family="Arial" font-size="16" font-weight="bold" fill="#24475E">Configuration facts</text>
  <text x="63" y="1055" font-family="Arial" font-size="13" fill="#5B7181">IV3InputTwin mode=1 (luminance + 5×5 local contrast); P2/P3 gated fusion; persistent 16ch P2; route=2; no P2 detection head; no slicing/ROI verification.</text>
