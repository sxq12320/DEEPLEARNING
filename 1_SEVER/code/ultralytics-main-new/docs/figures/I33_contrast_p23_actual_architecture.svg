<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-labelledby="figtitle figdesc">
  <title id="figtitle">I33 Contrast P2/P3 Actual Network Architecture</title>
  <desc id="figdesc">An architecture diagram transcribed from I33_contrast_p23.yaml and its actual modules. RGB and a two-channel luminance/local-contrast view are fused at P2 and P3. A persistent stride-four detail path is exchanged with P3 and P4 and injected into P4. P5, top-down P4 and P3 fusion, and a bottom-up P4 reconstruction feed a three-scale SegmentCitrusIV2 head. There is no P2 detection head or selective ROI inference.</desc>
