  <circle cx="103" cy="584" r="6" fill="#B9D473" stroke="#F4F7CF" stroke-width="1.5"/>
  <text x="137" y="688" text-anchor="middle" font-family="Arial" font-size="15" fill="#496677">single RGB modality</text>
  <text x="137" y="716" text-anchor="middle" font-family="Arial" font-size="13" fill="#6C8290">no extra image files</text>
  <rect x="63" y="763" width="148" height="101" rx="10" fill="#F0F5F8" stroke="#B9CAD4"/>
  <text x="137" y="793" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#31566D">IV3InputTwin</text>
  <text x="137" y="818" text-anchor="middle" font-family="Arial" font-size="13" fill="#607888">mode 1 · layer [0]</text>
  <text x="137" y="842" text-anchor="middle" font-family="Arial" font-size="13" fill="#607888">RGB + 2ch view</text>

  <!-- P2 extraction -->
  <rect x="271" y="195" width="348" height="429" rx="15" fill="#FFFFFF" stroke="#9CC7D7" stroke-width="2"/>
  <rect x="271" y="195" width="348" height="62" rx="15" fill="#0072B2"/>
  <rect x="271" y="239" width="348" height="18" fill="#0072B2"/>
  <text x="290" y="234" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF">01  P2 extraction + fusion</text>
  <text x="291" y="286" font-family="Arial" font-size="14" fill="#5D7485">stride 4 · 160 × 160 feature grid</text>
  <rect x="291" y="309" width="143" height="118" rx="9" fill="#E8F3FA" stroke="#9FC5DA" stroke-width="1.5"/>
