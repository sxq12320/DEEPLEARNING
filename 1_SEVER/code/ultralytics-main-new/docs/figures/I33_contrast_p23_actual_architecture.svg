  <ellipse cx="186" cy="460" rx="26" ry="15" transform="rotate(29 186 460)" fill="#7CAB78"/>
  <circle cx="125" cy="431" r="24" fill="#9FC467" stroke="#EDF3BE" stroke-width="2"/>
