    <text style="fill: #152b43; font: 700 9.2px 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="175.113071" y="65.478189" transform="rotate(-0 175.113071 65.478189)">① 提取图像线索</text>
