<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
  <style>
    text{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#14243a}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:600}.note{font-size:17px}.small{font-size:15px;fill:#526078}
    .panel{fill:#fbfdff;stroke:#ccd8e5;stroke-width:2}.blue{fill:#e8f3ff;stroke:#3e80cc;stroke-width:1.5}.orange{fill:#fff3df;stroke:#dd9d35;stroke-width:1.5}.purple{fill:#f1edff;stroke:#8975bd;stroke-width:1.5}.green{fill:#eaf7ef;stroke:#70a98a;stroke-width:1.5}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.bypass{fill:none;stroke:#3e80cc;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="1120" fill="white"/>
<text x="42" y="48" class="title">J11 机制细化图：已有思想的任务适配，与尚待验证的新意边界</text>
<text x="42" y="80" class="note">代码对应：citrus_j.py / citrus_j_loss.py；候选模型，未证明精度与GPU速度优势。</text>

<rect x="35" y="106" width="745" height="385" rx="12" class="panel"/>
<text x="57" y="140" class="head">(a) 一次竞争尺度融合 — 以P3为例</text>
<text x="57" y="168" class="small">借鉴：空间自适应融合；任务适配：直接主干取证，投影后对齐，不往返PAN。</text>
<rect x="58" y="196" width="115" height="60" rx="8" class="blue"/><text x="76" y="221" class="label">C3 / s8</text><text x="76" y="245" class="small">64 channels</text>
<rect x="58" y="281" width="115" height="60" rx="8" class="blue"/><text x="76" y="306" class="label">C2 / s4</text><text x="76" y="330" class="small">32 channels</text>
<rect x="58" y="366" width="115" height="60" rx="8" class="purple"/><text x="76" y="391" class="label">C4 / s16</text><text x="76" y="415" class="small">96 channels</text>
<path d="M173 226 H195" class="flow"/><path d="M173 311 H195" class="flow"/><path d="M173 396 H195" class="flow"/>
<rect x="198" y="195" width="158" height="65" rx="8" class="blue"/><text x="214" y="223" class="note">1×1 projection</text><text x="214" y="247" class="small">size unchanged</text>
<rect x="198" y="280" width="158" height="65" rx="8" class="blue"/><text x="214" y="308" class="note">project → pool</text><text x="214" y="332" class="small">to stride8</text>
<rect x="198" y="365" width="158" height="65" rx="8" class="purple"/><text x="214" y="393" class="note">project → up</text><text x="214" y="417" class="small">nearest to stride8</text>
<path d="M356 227 H395 V306 H420" class="flow"/><path d="M356 311 H420" class="flow"/><path d="M356 397 H395 V316 H420" class="flow"/>
<rect x="424" y="269" width="155" height="86" rx="9" class="orange"/><text x="440" y="296" class="label">Concat → score</text><text x="440" y="323" class="note">source softmax</text><text x="440" y="346" class="small">α₁ + α₂ + α₃ = 1</text>
<path d="M579 311 H602" class="flow"/><rect x="604" y="272" width="149" height="84" rx="9" class="green"/><text x="619" y="300" class="label">Σ αₛVₛ</text><text x="619" y="326" class="note">DW3 + PW1</text><text x="619" y="347" class="small">P3 output / s8</text>
<text x="58" y="464" class="note">∂Z/∂lₛ = αₛ(Vₛ−Z)；凸组合界只覆盖refine之前，不证明目标被自动选中。</text>

<rect x="815" y="106" width="750" height="385" rx="12" class="panel"/>
<text x="837" y="140" class="head">(b) 固定16位置的差分上下文读出</text>
<text x="837" y="168" class="small">借鉴：Differential Transformer / LinearDiff；不是原VCA复现或叶片消除定理。</text>
<rect x="840" y="234" width="108" height="70" rx="8" class="purple"/><text x="856" y="263" class="label">C4 / s16</text><text x="856" y="288" class="small">40×40×96</text>
<path d="M948 254 H965 V209 H985" class="flow"/><path d="M948 273 H985" class="flow"/><path d="M948 293 H965 V347 H985" class="flow"/>
<rect x="988" y="185" width="160" height="52" rx="8" class="purple"/><text x="1004" y="216" class="note">Q+ / pooled K+</text>
<rect x="988" y="252" width="160" height="52" rx="8" class="purple"/><text x="1004" y="283" class="note">Q− / pooled K−</text>
<rect x="988" y="319" width="160" height="52" rx="8" class="blue"/><text x="1004" y="350" class="note">pooled V / m16</text>
<path d="M1148 211 H1164" class="flow"/><path d="M1148 278 H1164" class="flow"/>
<rect x="1168" y="185" width="140" height="52" rx="8" class="orange"/><text x="1182" y="216" class="note">softmax → A+</text>
<rect x="1168" y="252" width="140" height="52" rx="8" class="orange"/><text x="1182" y="283" class="note">softmax → A−</text>
<path d="M1308 211 H1327 V257 H1344" class="flow"/><path d="M1308 278 H1344" class="flow"/>
<rect x="1348" y="226" width="181" height="102" rx="8" class="green"/><text x="1362" y="255" class="label">D = A+ − A−</text><text x="1362" y="282" class="note">D · V → Wout</text><text x="1362" y="308" class="small">+ 0.25tanh(g) residual</text>
<path d="M1148 346 H1424 V328" class="flow"/>
<text x="838" y="410" class="note">D1 = 0；V = 1bᵀ + E ⇒ DV = DE；D 本身一般不为0。</text>
<text x="838" y="441" class="note">固定预算O(Nm)，m=16；真实叶片与果实纹理都可能变化或被抵消。</text>
<text x="838" y="471" class="small">两次softmax必须独立归一化；J09/J10及J11/J13检验差分是否真的有益。</text>

<rect x="35" y="522" width="745" height="404" rx="12" class="panel"/>
<text x="57" y="559" class="head">(c) 软场景组织：分类调制，几何保留退路</text>
<text x="57" y="587" class="small">任务适配：前景 + 可见边界监督；没有叶片新类别，不硬删低响应候选。</text>
<rect x="58" y="622" width="145" height="57" rx="8" class="blue"/><text x="76" y="656" class="label">P2 / stride4</text>
<path d="M203 650 H225" class="flow"/><rect x="230" y="619" width="244" height="66" rx="8" class="orange"/><text x="247" y="647" class="label">PW1 → DW3 → PW2</text><text x="247" y="674" class="small">foreground + visible boundary</text>
<path d="M474 650 H498" class="flow"/><rect x="503" y="619" width="246" height="66" rx="8" class="green"/><text x="520" y="647" class="label">sigmoid foreground → pool</text><text x="520" y="674" class="small">r = 1 + .25tanh(g)·p；零起点</text>
<rect x="58" y="729" width="173" height="66" rx="8" class="purple"/><text x="76" y="759" class="label">P3 / P4 / P5</text><text x="76" y="783" class="small">candidate features</text>
<path d="M231 751 H294" class="flow"/><rect x="300" y="719" width="201" height="53" rx="8" class="green"/><text x="320" y="752" class="label">feature × r → Class</text>
<path d="M626 685 V710 H447 V719" class="flow"/>
<path d="M231 779 H267 V816 H300" class="bypass"/><rect x="300" y="791" width="449" height="54" rx="8" class="blue"/><text x="320" y="824" class="label">direct features → Box / Mask coefficients</text>
<text x="58" y="879" class="note">0.75 &lt; r &lt; 1.25；共享主干及正样本分配仍耦合，非完全独立任务。</text>
<text x="58" y="909" class="small">J07/J05与J11/J12检验门控；监督来自可见GT，不填圆、不补不可见部分。</text>

<rect x="815" y="522" width="750" height="404" rx="12" class="panel"/>
<text x="837" y="559" class="head">(d) 原生细节掩膜解码：不只是插值输出</text>
<text x="837" y="587" class="small">现有细节解码思想的适配；小目标无候选时，decoder本身不能修复漏检。</text>
<rect x="840" y="617" width="167" height="55" rx="8" class="blue"/><text x="855" y="649" class="note">P2 → 32ch / s4</text>
<rect x="840" y="689" width="167" height="55" rx="8" class="orange"/><text x="855" y="721" class="note">P3 → 32ch → up</text>
<path d="M1007 645 H1025 V680 H1047" class="flow"/><path d="M1007 717 H1025 V690 H1047" class="flow"/>
<rect x="1051" y="649" width="149" height="68" rx="8" class="green"/><text x="1067" y="677" class="label">add → up to s2</text><text x="1067" y="703" class="small">32 channels</text>
<rect x="840" y="780" width="252" height="55" rx="8" class="blue"/><text x="855" y="813" class="note">P1 stem → 16 channels / stride2</text>
<path d="M1200 683 H1215 V743 H1232" class="flow"/><path d="M1092 807 H1215 V755 H1232" class="flow"/>
<rect x="1236" y="712" width="292" height="79" rx="8" class="purple"/><text x="1252" y="739" class="label">concat48 → DW3 → PW32</text><text x="1252" y="769" class="note">32 prototypes / stride2</text>
<text x="838" y="867" class="note">instance logits = coefficients × prototypes；裁剪前矩阵rank≤32。</text>
<text x="838" y="898" class="small">J14/J15/J16：按GT等贡献tiny Dice / 可见边界带辅助项；收益仍待实验。</text>

<rect x="35" y="956" width="1530" height="112" rx="12" class="orange"/>
<text x="57" y="994" class="head">真正要验证的命题：保住极小实例支持 + 排除同色背景 + 保留可见拓扑，且预算可控</text>
<text x="57" y="1027" class="note">组件图更细 ≠ 新理论。当前J11为综合候选；后续由同协议消融、难例子集、三seed和真实GPU测速判定贡献。</text>
<text x="57" y="1053" class="small">对应新意审查：J_SERIES_NOVELTY_AUDIT_20261001.md。J11约1.075M / 5.216GFLOPs@640，不承诺大幅涨点。</text>
</svg>
