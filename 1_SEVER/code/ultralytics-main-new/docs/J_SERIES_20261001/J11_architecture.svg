<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <title>J11 candidate: detail-preserving encoding, competitive fusion and differential context</title>
  <desc>Editable architecture overview aligned with J11_synthesis.yaml. Classification receives a soft foreground prior; box and mask-coefficient towers do not. P1 and P2 feed a separate native stride2 mask decoder. Accuracy is pending.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0072B2"/></marker>
    <style>
      text {font-family:Arial,Helvetica,sans-serif;fill:#172334}
      .title {font-size:31px;font-weight:700}
      .heading {font-size:24px;font-weight:700}
      .label {font-size:21px;font-weight:700}
      .note {font-size:18px;fill:#475569}
      .small {font-size:17px;fill:#475569}
      .panel {fill:#fbfcfe;stroke:#cbd5e1;stroke-width:1.5}
      .blue {fill:#e9f4fc;stroke:#0072B2;stroke-width:1.7}
      .orange {fill:#fff4df;stroke:#cc8300;stroke-width:1.7}
      .purple {fill:#f4eefa;stroke:#8063ab;stroke-width:1.7}
      .flow {fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}
      .detail {fill:none;stroke:#0072B2;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#b)}
    </style>
  </defs>
  <rect width="1600" height="1060" fill="white"/>
  <text x="45" y="49" class="title">J11: Detail-preserving encoding and contrastive context</text>
  <text x="45" y="80" class="note">RGB immature-citrus visible instance segmentation · structural hypothesis, accuracy pending</text>

  <rect x="35" y="108" width="420" height="614" rx="15" class="panel"/>
  <rect x="510" y="108" width="370" height="614" rx="15" class="panel"/>
  <rect x="930" y="108" width="630" height="614" rx="15" class="panel"/>
  <text x="55" y="146" class="heading">a  Non-CSP feature encoder</text>
  <text x="530" y="146" class="heading">b  One-pass scale fusion</text>
  <text x="950" y="146" class="heading">c  Task-separated prediction</text>

  <rect x="65" y="168" width="360" height="69" rx="9" class="blue"/>
  <text x="85" y="195" class="label">RGB → [RGB, luma, contrast]</text>
  <text x="85" y="222" class="note">Space-to-depth + projection: P1, s2</text>
  <path d="M245,237 V266" class="flow"/>
  <rect x="85" y="268" width="320" height="60" rx="8" class="blue"/>
  <text x="105" y="294" class="label">C2 / P2: s4, 32 channels</text>
  <text x="105" y="318" class="note">JDown + JStage ×2</text>
  <path d="M245,328 V357" class="flow"/>
  <rect x="85" y="359" width="320" height="60" rx="8" class="blue"/>
  <text x="105" y="385" class="label">C3: s8, 64 channels</text>
  <text x="105" y="409" class="note">JDown + JStage ×2</text>
  <path d="M245,419 V448" class="flow"/>
  <rect x="85" y="450" width="320" height="87" rx="8" class="blue"/>
  <text x="105" y="477" class="label">C4: s16, 96 channels</text>
  <text x="105" y="502" class="note">JDown + JStage ×3</text>
  <text x="105" y="526" class="note">Differential context: 16 memories</text>
  <path d="M245,537 V566" class="flow"/>
  <rect x="85" y="568" width="320" height="86" rx="8" class="blue"/>
  <text x="105" y="595" class="label">C5: s32, 160 channels</text>
  <text x="105" y="620" class="note">JDown + JStage ×2 + SPPF</text>
  <text x="105" y="644" class="note">Local mixing + multiplicative gate</text>
  <text x="65" y="694" class="note">No C3k2; no custom CUDA / Mamba</text>

  <rect x="540" y="211" width="310" height="91" rx="9" class="orange"/>
  <text x="560" y="241" class="label">P3 = Fuse(C3, C2, C4)</text>
  <text x="560" y="268" class="note">Target s8 · width 64</text>
  <text x="560" y="291" class="small">Project → align → source softmax</text>
  <rect x="540" y="363" width="310" height="91" rx="9" class="orange"/>
  <text x="560" y="393" class="label">P4 = Fuse(C4, C3, C5)</text>
  <text x="560" y="420" class="note">Target s16 · width 96</text>
  <text x="560" y="443" class="small">Project → align → source softmax</text>
  <rect x="540" y="515" width="310" height="91" rx="9" class="orange"/>
  <text x="560" y="545" class="label">P5 = Fuse(C5, C4)</text>
  <text x="560" y="572" class="note">Target s32 · width 128</text>
  <text x="560" y="595" class="small">Project → align → source softmax</text>
  <path d="M405,389 H472 V256 H540" class="flow"/>
  <path d="M405,493 H487 V408 H540" class="flow"/>
  <path d="M405,611 H472 V560 H540" class="flow"/>
  <text x="540" y="652" class="note">Independent target-scale readouts</text>
  <text x="540" y="680" class="note">No full FPN → PAN round trip</text>

  <path d="M850,256 H910 V247 H960" class="flow"/>
  <path d="M850,408 H895 V276 H960" class="flow"/>
  <path d="M850,560 H910 V306 H960" class="flow"/>
  <rect x="960" y="202" width="220" height="126" rx="9" class="orange"/>
  <text x="980" y="233" class="label">P3 / P4 / P5</text>
  <text x="980" y="262" class="note">Box / class towers</text>
  <text x="980" y="291" class="note">Mask coefficients</text>
  <text x="980" y="316" class="small">8,400 candidates @640</text>
  <path d="M1180,265 H1220" class="flow"/>
  <rect x="1222" y="202" width="307" height="126" rx="9" class="orange"/>
  <text x="1242" y="234" class="label">Standard candidate interface</text>
  <text x="1242" y="265" class="note">DFL / scores / coefficients</text>
  <text x="1242" y="294" class="note">One-to-many · NMS</text>
  <text x="1242" y="318" class="small">Geometry is not hard-masked</text>

  <rect x="960" y="359" width="569" height="85" rx="9" class="purple"/>
  <text x="980" y="390" class="label">P2 soft scene: foreground + visible boundary</text>
  <text x="980" y="420" class="note">Zero-start residual gain → classification ONLY</text>
  <path d="M1100,359 V328" class="detail"/>

  <rect x="960" y="480" width="569" height="134" rx="9" class="blue"/>
  <text x="980" y="511" class="label">Native high-resolution mask decoder</text>
  <text x="980" y="541" class="note">P2 detail + upsampled P3 semantics + P1 stem</text>
  <text x="980" y="570" class="note">32 prototypes @ stride2 → instance mask logits</text>
  <text x="980" y="598" class="small">Preserve visible concavities; no circular completion</text>
  <path d="M1375,328 V480" class="flow"/>
  <text x="1389" y="470" class="small">coefficients</text>
  <path d="M425,203 H445 V740 H1010 V614" class="detail"/>
  <path d="M405,298 H430 V757 H1090 V614" class="detail"/>
  <text x="530" y="749" class="note">Retained early detail bypasses</text>
  <path d="M1245,614 V647" class="flow"/>
  <text x="985" y="684" class="label">Output: visible fruit instances</text>

  <rect x="35" y="787" width="480" height="195" rx="12" class="blue"/>
  <text x="55" y="824" class="heading">Phase &amp; detail preservation</text>
  <text x="55" y="858" class="note">Rearrangement is invertible;</text>
  <text x="55" y="886" class="note">learned compression is NOT lossless.</text>
  <text x="55" y="924" class="note">Dataset: 17.39% have short side &lt;16 px</text>
  <text x="55" y="953" class="note">after 640 letterbox; train/val/test fixed.</text>
  <rect x="540" y="787" width="480" height="195" rx="12" class="purple"/>
  <text x="560" y="824" class="heading">Contrastive context constraint</text>
  <text x="560" y="858" class="note">D = softmax(Q+K+ᵀ) − softmax(Q−K−ᵀ)</text>
  <text x="560" y="886" class="note">D1 = 0; constant value components cancel.</text>
  <text x="560" y="924" class="note">O(N × 16), not dense O(N²) attention.</text>
  <text x="560" y="953" class="note">Not a proof of leaf-background rejection.</text>
  <rect x="1045" y="787" width="515" height="195" rx="12" class="orange"/>
  <text x="1065" y="824" class="heading">Loss controls: J14 / J15 / J16</text>
  <text x="1065" y="858" class="note">Equal-GT auxiliary Dice · weight ∈ [1,2]</text>
  <text x="1065" y="886" class="note">GT-visible boundary band · no hard priors</text>
  <text x="1065" y="924" class="note">J11 has scene loss; tiny/boundary mask</text>
  <text x="1065" y="953" class="note">auxiliaries are explicit ablation variants.</text>
  <text x="45" y="1026" class="note">J11: 1.075M parameters · estimated 5.216 GFLOPs @640 · 20-arm controlled suite · gains and GPU speed await experiments</text>
</svg>
