#
# F07: 颈部 C3k2 → C3k2_DWR（多膨胀率残差，扩大颈部语义感受野）。
# 动机: 远处小果需要大范围枝叶上下文佐证；DWR 以并联膨胀卷积零成本扩感受野。
# 文献: Wei et al., DWRSeg 2022, arXiv:2212.01173。
# 消融角色: C 组单模块（上下文）| python train_citrus_seg.py --model 0_orange_yaml/1_far_small/F07_yolo11-seg-c3k2dwr.yaml --pretrained yolo11n-seg.pt --name F07_dwr

# Parameters
nc: 80 # number of classes (overridden by the dataset YAML, e.g. nc=1 for citrus)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12: cat backbone P4
  - [-1, 2, C3k2_DWR, [512, False]] # 13-P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15: cat backbone P3
  - [-1, 2, C3k2_DWR, [256, False]] # 16-P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18: cat head P4
  - [-1, 2, C3k2_DWR, [512, False]] # 19-P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21: cat head P5
  - [-1, 2, C3k2_DWR, [1024, True]] # 22-P5/32
  - [[16, 19, 22], 1, Segment, [nc, 32, 256]] # 23-Segment(P3, P4, P5)
