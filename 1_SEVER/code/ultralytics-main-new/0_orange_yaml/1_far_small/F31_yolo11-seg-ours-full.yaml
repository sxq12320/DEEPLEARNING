#
# F31: CitrusFar-Seg-Full（本课题主推组合，6 组件）：
#   DFEM（原创，频域+暗区增强）+ SPD-Conv（无损下采样）+ SPPF_LSKA（全局上下文）
#   + BiFPNConcat（加权融合）+ DySample（动态上采样）+ LIAM（原创，亮度不变注意力）。
# 训练时配合 --iou-type NWDWise（原创损失）与可选 --slide 构成完整方法。
# 消融角色: I 组主模型；F32-F37 为其 leave-one-out | python train_citrus_seg.py --model 0_orange_yaml/1_far_small/F31_yolo11-seg-ours-full.yaml --pretrained yolo11n-seg.pt --name F31_ours_full

# Parameters
nc: 80 # number of classes (overridden by the dataset YAML, e.g. nc=1 for citrus)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, SPDConv, [256, 3]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, DFEM, []] # 5-P3 增强模块（原创）
  - [-1, 1, SPDConv, [512, 3]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7-P4/16
  - [-1, 1, SPDConv, [1024, 3]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9-P5/32
  - [-1, 1, SPPF_LSKA, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

head:
  - [-1, 1, DySample, []] # 12
  - [[-1, 7], 1, BiFPNConcat, []] # 13: cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14-P4/16
  - [-1, 1, DySample, []] # 15
  - [[-1, 5], 1, BiFPNConcat, []] # 16: cat backbone P3 (DFEM 增强后)
  - [-1, 2, C3k2, [256, False]] # 17-P3/8
  - [-1, 1, LIAM, []] # 18-P3 颈部注意力槽位
  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 14], 1, BiFPNConcat, []] # 20: cat head P4
  - [-1, 2, C3k2, [512, False]] # 21-P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 11], 1, BiFPNConcat, []] # 23: cat head P5
  - [-1, 2, C3k2, [1024, True]] # 24-P5/32
  - [[18, 21, 24], 1, Segment, [nc, 32, 256]] # 25-Segment(P3, P4, P5)
