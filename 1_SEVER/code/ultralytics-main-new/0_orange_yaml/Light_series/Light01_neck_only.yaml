# Light01: official YOLO11n backbone with the complete Light-AFPN neck replacement.
nc: 80
scale: n
pretrained_layer_map: {15: 23} # shortened neck: transfer the compatible official Segment head
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]] # P2/4
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # P3/8
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # P4/16
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # P5/32

head:
  - [[2, 4, 6, 10], 1, CitrusLightAFPN, [[256, 512, 1024], 8]]
  - [11, 1, Index, [64, 0]] # P3/8
  - [11, 1, Index, [128, 1]] # P4/16
  - [11, 1, Index, [256, 2]] # P5/32
  - [[12, 13, 14], 1, Segment, [nc, 32, 256]]
