# Light00: PConv deep-backbone isolation; preserve official P2/P3, C2PSA, PAN and Segment.
nc: 80
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]] # P2/4: preserve shallow detail and transfer
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # P3/8: preserve small-object semantics
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, CitrusLightStage, [512, 1, 1.0, 4, 0.1]] # P4/16: deep partial-conv compression
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, CitrusLightStage, [1024, 1, 1.0, 4, 0.1]] # P5/32: deep partial-conv compression
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # keep the official context block to isolate only P4/P5 stages

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[16, 19, 22], 1, Segment, [nc, 32, 256]]
