# E05 vs E04 isolates slicing on the SAME hybrid architecture.
# E: full/global-vs-sliced input controls; see citrus_e_suite.py for the input recipe.
# Exploratory reuse of G10-inspired PConv, single-level WTConv and LSKA.
# These are this repository's historical adaptations, NOT full official backbone reproductions.
nc: 80
scale: n
scales:
  n: [0.50, 0.25, 1024]
backbone:
  - [-1, 1, SAGEV8PhaseStem, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2_Faster, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2_Faster, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2_WT, [1024, true]]
  - [-1, 1, SPPF_LSKA, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, false]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, false]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, false]]
  - [-1, 1, nn.Identity, []]
  - [-1, 1, nn.Identity, []]
  - [-1, 1, nn.Identity, []]
  - [[16, 19, 10, 2], 1, SegmentCitrusSAGEV5, [nc, 32, 256, 16, true, false, 0, 0]]


