# J30_rep_pan: Non-CSP reparameterizable backbone with original PAN neck and P3/P4/P5 prediction
# Experimental candidate, no accuracy claim.
nc: 1
scale: n
scales:
  n: [1.0, 1.0, 1024]
backbone:
  - [-1, 1, Conv, [24, 3, 2]]
  - [-1, 1, nn.Identity, []]
  - [-1, 1, Conv, [48, 3, 2]]
  - [-1, 2, J2RepStage, [48, 2.0]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 3, J2RepStage, [96, 2.0]]
  - [-1, 1, Conv, [160, 3, 2]]
  - [-1, 4, J2RepStage, [160, 2.0]]
  - [-1, 1, Conv, [224, 3, 2]]
  - [-1, 2, J2RepStage, [224, 2.0]]
  - [-1, 1, SPPF, [224, 5]]
head:
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, false]]
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 1, C3k2, [96, false]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, false]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [192, false]]
  - [[16, 19, 22], 1, Segment, [1, 32, 64]]
