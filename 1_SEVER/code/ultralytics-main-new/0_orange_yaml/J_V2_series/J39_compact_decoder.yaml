# J39_compact_decoder: J32 plus narrow prototype decoder; high-resolution 1x1 output only
# Experimental candidate, no accuracy claim.
nc: 1
scale: n
scales:
  n: [1.0, 1.0, 1024]
backbone:
  - [-1, 1, Conv, [24, 3, 2]]
  - [-1, 1, nn.Identity, []]
  - [-1, 1, Conv, [48, 3, 2]]
  - [-1, 2, J2RepStage, [48, 2.0]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 3, J2RepStage, [96, 2.0]]
  - [-1, 1, Conv, [160, 3, 2]]
  - [-1, 4, J2RepStage, [160, 2.0]]
  - [-1, 1, Conv, [224, 3, 2]]
  - [-1, 2, J2RepStage, [224, 2.0]]
  - [-1, 1, SPPF, [224, 5]]
head:
  - [[7, 10], 1, J2ResidualFuse, [96, 1]]
  - [[5, 11], 1, J2ResidualFuse, [64, 1]]
  - [[3, 12], 1, J2ResidualFuse, [32, 1]]
  - [[13, 12, 11], 1, SegmentCitrusJ2Structural, [1, 32, 64, false, 0.0, false, 2, 32, true]]
