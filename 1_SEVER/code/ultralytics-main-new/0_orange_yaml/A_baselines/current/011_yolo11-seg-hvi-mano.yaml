# Ultralytics YOLO11-seg — HVIEnhance low-light front-end + MANO at P3/P4/P5 (ours-full).
# Single-stream 3-ch RGB, single class (orange_immature) immature-citrus instance seg.
#
# Combines the two improvements:
#   * layer 0  HVIEnhance  — region-gated low-light enhancement (3->3), shifts all layers +1.
#   * P3/P4/P5 C2MANO      — multipole attention refines the (shifted) neck outputs 17/20/23,
#                            appended before Segment (Segment reads 24/25/26).
# Transfer COCO weights with train_citrus_seg_hvi.py (index-shift-aware, shift=1): the
# backbone+neck transfer from yolo11n-seg.pt; HVIEnhance + the 3 C2MANO blocks + Segment
# are new (random init / re-init for nc=1). This is the top of the ablation ladder:
#   001 (baseline) -> 010 (HVI only) -> 008 (C2MANO-P345 only) -> 011 (HVI + C2MANO).

nc: 1 # number of classes (orange_immature)
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (+ HVIEnhance front-end at layer 0 — everything below shifted +1)
backbone:
  - [-1, 1, HVIEnhance, [16, 2]] # 0  low-light HVI enhancement (3->3): args=[base, blocks]
  - [-1, 1, Conv, [64, 3, 2]] # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 3
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

# YOLO11n head (absolute indices = baseline + 1; C2MANO refines each neck output)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 7], 1, Concat, [1]] # 13 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19 cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  - [17, 1, C2MANO, [256]] # 24  multipole attention refines P3
  - [20, 1, C2MANO, [512]] # 25  multipole attention refines P4
  - [23, 1, C2MANO, [1024]] # 26  multipole attention refines P5
  - [[24, 25, 26], 1, Segment, [nc, 32, 256]] # 27  Segment(P3*, P4*, P5*)
