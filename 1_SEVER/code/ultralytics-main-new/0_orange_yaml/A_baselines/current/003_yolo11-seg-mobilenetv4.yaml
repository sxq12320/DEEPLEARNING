# Ultralytics YOLO11-seg with a MobileNetV4 lightweight backbone (single-stream, 3-ch RGB)
# Backbone swapped to MobileNetV4 (Universal Models for the Mobile Ecosystem, ECCV 2024, conv_m variant);
# YOLO11 neck + Segment head kept. For the orange/citrus immature-fruit instance-seg efficiency-axis ablation.
# Backbone modules (MobileNetV4Stem_RGB / MobileNetV4Stage) live in ultralytics/nn/modules/mobilenetv4_rgb.py
# and are registered in tasks.py parse_model. Stage channels are FIXED (not width-scaled); variant defaults to conv_m.

nc: 1 # number of classes (orange_immature)
scales: # 'n' is used by default (filename carries no scale letter)
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# MobileNetV4 (conv_m) backbone: Stem(P1/2) -> Stage32(P2/4) -> Stage64(P3/8) -> Stage96(P4/16) -> Stage128(P5/32)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, MobileNetV4Stem_RGB, []] # 0-P1/2  (640->320, 32ch)
  - [-1, 1, MobileNetV4Stage, [32]] # 1-P2/4  (320->160, 32ch)
  - [-1, 1, MobileNetV4Stage, [64]] # 2-P3/8  (160->80, 64ch)    <- P3
  - [-1, 1, MobileNetV4Stage, [96]] # 3-P4/16 (80->40, 96ch)     <- P4
  - [-1, 1, MobileNetV4Stage, [128]] # 4-P5/32 (40->20, 128ch)
  - [-1, 1, SPPF, [1024, 5]] # 5
  - [-1, 1, C2PSA, [1024]] # 6-P5   <- P5

# YOLO11 head (indices re-mapped: backbone P3=2, P4=3, P5=6)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 7
  - [[-1, 3], 1, Concat, [1]] # 8  cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 9

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 2], 1, Concat, [1]] # 11 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 12 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 13
  - [[-1, 9], 1, Concat, [1]] # 14 cat head P4
  - [-1, 2, C3k2, [512, False]] # 15 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 16
  - [[-1, 6], 1, Concat, [1]] # 17 cat backbone P5
  - [-1, 2, C3k2, [1024, True]] # 18 (P5/32-large)

  - [[12, 15, 18], 1, Segment, [nc, 32, 256]] # 19 Segment(P3, P4, P5)
