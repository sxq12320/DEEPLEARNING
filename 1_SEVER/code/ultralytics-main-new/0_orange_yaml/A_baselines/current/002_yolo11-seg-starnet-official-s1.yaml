# YOLO11-seg with the official StarNet-S1 backbone from Rewrite the Stars (CVPR 2024).
# Only the backbone is replaced. The YOLO11 segmentation neck/head is kept for comparison.

nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # StarNetBackbone returns [P2/4, P3/8, P4/16, P5/32].
  - [-1, 1, StarNetBackbone, [s1, False, 0.0]] # 0
  - [0, 1, Index, [48, 1]] # 1-P3/8
  - [0, 1, Index, [96, 2]] # 2-P4/16
  - [0, 1, Index, [192, 3]] # 3-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 4
  - [-1, 1, C2PSA, [1024]] # 5-P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 6
  - [[-1, 2], 1, Concat, [1]] # 7
  - [-1, 2, C3k2, [512, False]] # 8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 1], 1, Concat, [1]] # 10
  - [-1, 2, C3k2, [256, False]] # 11-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 12
  - [[-1, 8], 1, Concat, [1]] # 13
  - [-1, 2, C3k2, [512, False]] # 14-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16
  - [-1, 2, C3k2, [1024, True]] # 17-P5/32

  - [[11, 14, 17], 1, Segment, [nc, 32, 256]] # 18
