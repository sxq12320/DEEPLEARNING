# YOLO11-seg with the official StarNet-S2 backbone from Rewrite the Stars (CVPR 2024).

nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, StarNetBackbone, [s2, False, 0.0]] # 0 returns [P2, P3, P4, P5]
  - [0, 1, Index, [64, 1]] # 1-P3/8
  - [0, 1, Index, [128, 2]] # 2-P4/16
  - [0, 1, Index, [256, 3]] # 3-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 4
  - [-1, 1, C2PSA, [1024]] # 5-P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[11, 14, 17], 1, Segment, [nc, 32, 256]]
