# Ultralytics YOLO11-seg + MANO Multipole Attention at ALL THREE detection scales.
# Single-stream 3-ch RGB, single class (orange_immature) immature-citrus instance seg.
#
# Placement study (vs 004 which REPLACES the backbone C2PSA): here C2PSA is KEPT
# intact at backbone layer 10, and a C2MANO block refines EACH of the NECK P3/P4/P5
# outputs (layers 16/19/22) right before Segment. Appended at the end so the PAN neck
# internals are untouched and backbone+neck COCO weights transfer directly.
# Ablation axis = which detection scale(s) get C2MANO. THIS FILE: P3 + P4 + P5 (all).

nc: 1 # number of classes (orange_immature)
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (baseline — C2PSA kept, NOT replaced)
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10  (baseline C2PSA kept)

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [16, 1, C2MANO, [256]] # 23  multipole attention refines P3
  - [19, 1, C2MANO, [512]] # 24  multipole attention refines P4
  - [22, 1, C2MANO, [1024]] # 25  multipole attention refines P5
  - [[23, 24, 25], 1, Segment, [nc, 32, 256]] # 26  Segment(P3*, P4*, P5*)
