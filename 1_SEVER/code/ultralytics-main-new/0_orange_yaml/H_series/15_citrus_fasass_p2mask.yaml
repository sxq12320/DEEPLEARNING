# 15: task-focused clean architecture (P2 mask-only control).
# FrequencyAwareDown at P2->P3 and P3->P4 protects tiny detail; P4 CitrusSAVSS supplies whole-orchard context;
# F14's proven SPPF_LSKA remains at P5. P2 joins the neck but is excluded from box/class prediction.
# Faster/WT/CARAFE/BiFPN are removed because 10_hybrid did not materially beat F14 and they obscure attribution.
nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]                 # 2 P2/4: persistent high-resolution detail
  - [-1, 1, FrequencyAwareDown, [256]]                # 3 P2->P3 anti-alias + high-frequency bypass
  - [-1, 2, C3k2, [512, False, 0.25]]                 # 4 P3/8
  - [-1, 1, FrequencyAwareDown, [512]]                # 5 P3->P4 anti-alias + high-frequency bypass
  - [-1, 2, C3k2, [512, True]]                        # 6 P4/16
  - [-1, 1, CitrusSAVSS, [512, 8, 1.0, 2]]            # 7 local texture gates pooled global context
  - [-1, 1, Conv, [1024, 3, 2]]                       # P5 keeps ordinary downsample; tiny path already branches
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF_LSKA, [1024, 5]]                     # 10 proven global spatial selection
  - [-1, 2, C2PSA, [1024]]                            # 11 P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                       # 14 P4 top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]                       # 17 P3 top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False, 0.25]]                 # 20 P2 neck feature
  - [17, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                       # 23 P4 bottom-up
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                       # 26 P5 bottom-up
  - [[20, 17, 23, 26], 1, SegmentP2Boundary, [nc, 32, 256]]

