# 12: 10-hybrid + P2 参与 Neck 融合（真拓扑改动，非模块替换）.
# 相对 10_hybrid 的唯一差异：Neck 在 P3 级特征（idx16）之后新增三级融合节点
#   CARAFE(idx16, /8→/4) + BiFPNConcat(⊕ 骨干 P2, idx2) + C3k2 → 增强 P2（idx19），
# SegmentP2Boundary 的 P2 输入由"骨干原始 P2"换成"Neck 融合增强 P2"。
# 原版 YOLO 系所有层级中 /4 高分辨率特征从不进入 Neck，只直连 Head；本结构让
# P2 参与 Neck 的多尺度融合回路，是针对 47.9% 实例 <32px 的拓扑级小目标改进。
# 底向上路径仍从 idx16 出发（显式引用），与 10_hybrid 完全一致 → 干净单变量。
# 其余所有层、通道、连接与 10_yolo11n-seg-hybrid-lska-carafe-bifpn-p2b.yaml 相同。
nc: 80
scales:
  n: [0.50, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2_Faster, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2_Faster, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2_WT, [1024, True]]
  - [-1, 1, SPPF_LSKA, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
head:
  - [-1, 1, CARAFE, []]                  # 11  /32→/16
  - [[-1, 6], 1, BiFPNConcat, []]        # 12  ⊕ L6
  - [-1, 2, C3k2, [512, False]]          # 13
  - [-1, 1, CARAFE, []]                  # 14  /16→/8
  - [[-1, 4], 1, BiFPNConcat, []]        # 15  ⊕ L4
  - [-1, 2, C3k2, [256, False]]          # 16  P3 级融合特征
  # ---- 新增：P2 Neck 融合支路（拓扑改动所在）----
  - [-1, 1, CARAFE, []]                  # 17  /8→/4 上采样 P3 级特征
  - [[-1, 2], 1, BiFPNConcat, []]        # 18  ⊕ 骨干 P2 (idx2)
  - [-1, 2, C3k2, [256, False, 0.25]]    # 19  增强 P2（e=0.25 控制 /4 分辨率开销）
  # ---- 底向上 PAN：显式从 16 出发，与 10_hybrid 完全一致 ----
  - [16, 1, Conv, [256, 3, 2]]           # 20  /8→/16
  - [[-1, 13], 1, BiFPNConcat, []]       # 21  ⊕ L13
  - [-1, 2, C3k2, [512, False]]          # 22  P4
  - [-1, 1, Conv, [512, 3, 2]]           # 23  /16→/32
  - [[-1, 10], 1, BiFPNConcat, []]       # 24  ⊕ L10
  - [-1, 2, C3k2, [1024, True]]          # 25  P5
  - [[19, 16, 22, 25], 1, SegmentP2Boundary, [nc, 32, 256]]  # 26  增强P2·P3·P4·P5
