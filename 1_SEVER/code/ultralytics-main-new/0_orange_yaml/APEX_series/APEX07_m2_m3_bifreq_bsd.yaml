# APEX07 (+M2 +M3 Dual-Module / Ablation Step 2):
# 100% Native YOLO11n-seg Backbone + Full Bidirectional M2(BiFreq-PAN + C2PhaseBridge) + 64-ch M3(BSD-Head).
nc: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]

pretrained_layer_map:
  17: -1
  18: 17
  19: -1
  20: 19
  21: 20
  22: -1
  23: 22
  24: 23

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-C2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-C3
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-C4
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-C5
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, CitrusFreqAlignedFusion, [16, "topdown"]] # 12
  - [-1, 2, C3k2, [512, False]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, CitrusFreqAlignedFusion, [16, "topdown"]] # 15
  - [-1, 2, C3k2, [256, False]] # 16
  - [[16, 2], 1, C2PhaseBridge, [16]] # 17-P3
  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 13], 1, CitrusFreqAlignedFusion, [16, "bottomup"]] # 19
  - [-1, 2, C3k2, [512, False]] # 20-N4
  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 10], 1, CitrusFreqAlignedFusion, [16, "bottomup"]] # 22
  - [-1, 2, C3k2, [1024, True]] # 23-N5
  - [[17, 20, 23, 2], 1, SegmentCitrusBSD, [nc, 32, 256, 64, 16, True, True, False, 0.0]] # 24
