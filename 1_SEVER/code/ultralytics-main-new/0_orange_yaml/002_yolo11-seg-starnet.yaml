# Ultralytics YOLO11-seg with a StarNet lightweight backbone (single-stream, 3-ch RGB)
# Backbone swapped to StarNet (Rewrite the Stars, CVPR 2024); YOLO11 neck + Segment head kept.
# For the orange/citrus immature-fruit instance-seg efficiency-axis ablation.
# Backbone modules (StarNetStem_Depth / StarNetStage) live in ultralytics/nn/modules/starnet_depth.py
# and are registered in tasks.py parse_model. Channels of the StarNet stages are FIXED (not width-scaled).

nc: 1 # number of classes (orange_immature)
scales: # 'n' is used by default (filename carries no scale letter)
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# StarNet backbone: Conv(P1/2) -> StarNetStem(4x -> P3/8) -> StarNetStage(P4/16) -> StarNetStage(P5/32)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2  (640->320)
  - [-1, 1, StarNetStem_Depth, [32]] # 1-P3/8  (320->80, 32ch)   <- P3
  - [-1, 1, StarNetStage, [64, 3]] # 2-P4/16 (80->40, 64ch)      <- P4
  - [-1, 1, StarNetStage, [128, 3]] # 3-P5/32 (40->20, 128ch)
  - [-1, 1, SPPF, [1024, 5]] # 4
  - [-1, 1, C2PSA, [1024]] # 5-P5    <- P5

# YOLO11 head (indices re-mapped: backbone P3=1, P4=2, P5=5)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 6
  - [[-1, 2], 1, Concat, [1]] # 7  cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 1], 1, Concat, [1]] # 10 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 11 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 12
  - [[-1, 8], 1, Concat, [1]] # 13 cat head P4
  - [-1, 2, C3k2, [512, False]] # 14 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16 cat backbone P5
  - [-1, 2, C3k2, [1024, True]] # 17 (P5/32-large)

  - [[11, 14, 17], 1, Segment, [nc, 32, 256]] # 18 Segment(P3, P4, P5)
