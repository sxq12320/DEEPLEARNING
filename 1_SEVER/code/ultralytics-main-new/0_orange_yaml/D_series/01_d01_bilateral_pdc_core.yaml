# D01: core bilateral backbone. PDC P2 shape stream + P3/P4/P5 semantic gates; stock P3-P5 head.
nc: 80
scales:
  n: [0.50, 0.25, 1024]
pretrained_layer_map: {13: 11, 14: 12, 15: 13, 16: 14, 17: 15, 18: 16, 19: 17, 20: 18, 21: 19, 22: 20, 23: 21, 24: 22, 25: 23}
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 P2/4
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 P3/8
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 6 P4/16
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 10 P5/32
  - [[2, 4, 6, 10], 1, CitrusShapeStream, [256, pdc, 3]] # 11 persistent P2 shape
  - [[4, 11], 1, CitrusShapeFusion, [16]] # 12 shape-refined P3
head:
  - [10, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 15
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 18 P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 21 P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 24 P5
  - [[18, 21, 24], 1, Segment, [nc, 32, 256]]
