#
# F38: CitrusFar-Seg-Full-P2 = F31 全部组件 + P2/4 高分辨率检测层（性能上限探索版）。
# mask 原型来自 P2/4（160x160），远处小果掩码质量最优；代价为最大的显存与延迟。
# 消融角色: I 组上限版（vs F31 权衡）| python train_citrus_seg.py --model 0_orange_yaml/F_series/F38_yolo11-seg-ours-full-p2.yaml --pretrained yolo11n-seg.pt --name F38_ours_p2

# Parameters
nc: 80 # number of classes (overridden by the dataset YAML, e.g. nc=1 for citrus)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, SPDConv, [256, 3]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, DFEM, []] # 5-P3 增强模块（原创）
  - [-1, 1, SPDConv, [512, 3]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7-P4/16
  - [-1, 1, SPDConv, [1024, 3]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9-P5/32
  - [-1, 1, SPPF_LSKA, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

head:
  - [-1, 1, DySample, []] # 12
  - [[-1, 7], 1, BiFPNConcat, []] # 13: cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14-P4/16
  - [-1, 1, DySample, []] # 15
  - [[-1, 5], 1, BiFPNConcat, []] # 16: cat backbone P3 (DFEM 增强后)
  - [-1, 2, C3k2, [256, False]] # 17-P3/8
  - [-1, 1, DySample, []] # 18
  - [[-1, 2], 1, BiFPNConcat, []] # 19: cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 20-P2/4 高分辨率小目标层
  - [-1, 1, Conv, [128, 3, 2]] # 21
  - [[-1, 17], 1, BiFPNConcat, []] # 22: cat head P3
  - [-1, 2, C3k2, [256, False]] # 23-P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 14], 1, BiFPNConcat, []] # 25: cat head P4
  - [-1, 2, C3k2, [512, False]] # 26-P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 27
  - [[-1, 11], 1, BiFPNConcat, []] # 28: cat head P5
  - [-1, 2, C3k2, [1024, True]] # 29-P5/32
  - [[20, 23, 26, 29], 1, Segment, [nc, 32, 256]] # 30-Segment(P2, P3, P4, P5)
