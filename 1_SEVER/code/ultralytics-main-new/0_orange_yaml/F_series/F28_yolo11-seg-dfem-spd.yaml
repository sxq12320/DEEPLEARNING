#
# F28: DFEM 频域增强 + SPD 无损下采样（先增强、再无损传递）。
# 消融角色: H 组交互（F19 x F03）| python train_citrus_seg.py --model 0_orange_yaml/1_far_small/F28_yolo11-seg-dfem-spd.yaml --pretrained yolo11n-seg.pt --name F28_dfem_spd

# Parameters
nc: 80 # number of classes (overridden by the dataset YAML, e.g. nc=1 for citrus)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, SPDConv, [256, 3]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, DFEM, []] # 5-P3 增强模块（原创）
  - [-1, 1, SPDConv, [512, 3]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7-P4/16
  - [-1, 1, SPDConv, [1024, 3]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 7], 1, Concat, [1]] # 13: cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14-P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16: cat backbone P3 (DFEM 增强后)
  - [-1, 2, C3k2, [256, False]] # 17-P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19: cat head P4
  - [-1, 2, C3k2, [512, False]] # 20-P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22: cat head P5
  - [-1, 2, C3k2, [1024, True]] # 23-P5/32
  - [[17, 20, 23], 1, Segment, [nc, 32, 256]] # 24-Segment(P3, P4, P5)
