#
# F02: P2 检测层 + SPD-Conv 无损下采样（骨干 3 处步长卷积替换）。
# 动机: P2 层保住分辨率后，下采样仍丢 3/4 像素；SPD 重排到通道维实现信息无损。
# 文献: SPD-Conv (Sunkara & Luo, ECML-PKDD 2022, arXiv:2208.03641)。
# 消融角色: A 组组合 | python train_citrus_seg.py --model 0_orange_yaml/F_series/F02_yolo11-seg-p2-spd.yaml --pretrained yolo11n-seg.pt --name F02_p2_spd

# Parameters
nc: 80 # number of classes (overridden by the dataset YAML, e.g. nc=1 for citrus)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, SPDConv, [256, 3]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, SPDConv, [512, 3]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, SPDConv, [1024, 3]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12: cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13-P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15: cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16-P3/8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18: cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19-P2/4 高分辨率小目标层
  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21: cat head P3
  - [-1, 2, C3k2, [256, False]] # 22-P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24: cat head P4
  - [-1, 2, C3k2, [512, False]] # 25-P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27: cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28-P5/32
  - [[19, 22, 25, 28], 1, Segment, [nc, 32, 256]] # 29-Segment(P2, P3, P4, P5)
