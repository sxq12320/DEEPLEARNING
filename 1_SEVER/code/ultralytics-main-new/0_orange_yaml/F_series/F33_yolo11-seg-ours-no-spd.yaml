#
# F33: F31 拓扑（DFEM@5 + SPD 下采样 + SPPF_LSKA + BiFPN + DySample + LIAM@18），去 SPD（下采样还原步长 Conv）。
# 与 F31 逐层索引完全对齐（占位模块），预训练迁移与层深一致——干净 leave-one-out。
# 消融角色: I 组 leave-one-out | python train_citrus_seg.py --model 0_orange_yaml/F_series/F33_yolo11-seg-ours-no-spd.yaml --pretrained yolo11n-seg.pt --name F33_no_spd

# Parameters
nc: 80 # number of classes (overridden by the dataset YAML, e.g. nc=1 for citrus)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, DFEM, []] # 5-P3 增强模块（原创）
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9-P5/32
  - [-1, 1, SPPF_LSKA, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

head:
  - [-1, 1, DySample, []] # 12
  - [[-1, 7], 1, BiFPNConcat, []] # 13: cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14-P4/16
  - [-1, 1, DySample, []] # 15
  - [[-1, 5], 1, BiFPNConcat, []] # 16: cat backbone P3 (DFEM 增强后)
  - [-1, 2, C3k2, [256, False]] # 17-P3/8
  - [-1, 1, LIAM, []] # 18-P3 颈部注意力槽位
  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 14], 1, BiFPNConcat, []] # 20: cat head P4
  - [-1, 2, C3k2, [512, False]] # 21-P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 11], 1, BiFPNConcat, []] # 23: cat head P5
  - [-1, 2, C3k2, [1024, True]] # 24-P5/32
  - [[18, 21, 24], 1, Segment, [nc, 32, 256]] # 25-Segment(P3, P4, P5)
