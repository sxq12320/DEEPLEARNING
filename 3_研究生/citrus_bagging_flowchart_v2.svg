<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e6ebf2" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#243447"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#b91c1c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 36px "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .box { stroke: #243447; stroke-width: 2.5; rx: 10; ry: 10; filter: drop-shadow(0 4px 5px rgba(15,23,42,.10)); }
      .input { fill: #dbeafe; }
      .sense { fill: #dcfce7; }
      .decision { fill: #fff7cc; }
      .action { fill: #ede9fe; }
      .risk { fill: #fee2e2; }
      .text { font: 700 20px "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 700 16px "Microsoft YaHei", Arial, sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
      .label { font: 700 17px "Microsoft YaHei", Arial, sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: none; stroke: #243447; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-red { fill: none; stroke: #b91c1c; stroke-width: 3; marker-end: url(#arrowRed); }
      .lane { fill: rgba(255,255,255,.62); stroke: #d6dee9; stroke-width: 1.5; rx: 18; ry: 18; }
      .lane-title { font: 800 20px "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .legend-text { font: 700 16px "Microsoft YaHei", Arial, sans-serif; fill: #334155; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1180"/>
  <rect width="1800" height="1180" fill="url(#grid)" opacity=".75"/>

  <text x="900" y="54" class="title" text-anchor="middle">柑橘套袋机器人视觉感知与作业决策流程</text>
  <text x="900" y="90" class="subtitle" text-anchor="middle">RGB视觉感知 → 遮挡评估 → 游离/方向生成 → 机械套袋 → 套后确认 → 列表更新</text>

  <!-- Lane backgrounds -->
  <rect x="52" y="124" width="1696" height="196" class="lane"/>
  <text x="78" y="156" class="lane-title">一、视觉感知与目标生成</text>
  <rect x="52" y="356" width="1696" height="250" class="lane"/>
  <text x="78" y="388" class="lane-title">二、遮挡判断与可套袋性决策</text>
  <rect x="52" y="642" width="1696" height="276" class="lane"/>
  <text x="78" y="674" class="lane-title">三、机械执行与视觉闭环</text>
  <rect x="52" y="952" width="1696" height="146" class="lane"/>
  <text x="78" y="984" class="lane-title">四、结果更新与下一轮作业</text>

  <!-- Main top row -->
  <rect x="95" y="190" width="190" height="76" class="box input"/>
  <text x="190" y="218" class="text"><tspan x="190" dy="0">RGB相机</tspan><tspan x="190" dy="26">采集图像</tspan></text>

  <rect x="365" y="190" width="190" height="76" class="box input"/>
  <text x="460" y="218" class="text"><tspan x="460" dy="0">图像预处理</tspan><tspan x="460" dy="26">亮度/尺度/增强</tspan></text>

  <rect x="635" y="190" width="210" height="76" class="box sense"/>
  <text x="740" y="218" class="text"><tspan x="740" dy="0">实例分割</tspan><tspan x="740" dy="26">柑橘/果袋/枝叶</tspan></text>

  <rect x="925" y="190" width="210" height="76" class="box sense"/>
  <text x="1030" y="218" class="text"><tspan x="1030" dy="0">生成目标列表</tspan><tspan x="1030" dy="26">位置/面积/轮廓</tspan></text>

  <rect x="1215" y="190" width="230" height="76" class="box decision"/>
  <text x="1330" y="218" class="text"><tspan x="1330" dy="0">作业优先级排序</tspan><tspan x="1330" dy="26">先易后难</tspan></text>

  <path class="arrow" d="M285 228 H365"/>
  <path class="arrow" d="M555 228 H635"/>
  <path class="arrow" d="M845 228 H925"/>
  <path class="arrow" d="M1135 228 H1215"/>

  <!-- Decision diamond -->
  <polygon points="1580,168 1662,228 1580,288 1498,228" class="box decision"/>
  <text x="1580" y="216" class="text"><tspan x="1580" dy="0">遮挡程度</tspan><tspan x="1580" dy="26">判断</tspan></text>
  <path class="arrow" d="M1445 228 H1498"/>

  <!-- Occlusion branches -->
  <rect x="220" y="440" width="250" height="86" class="box sense"/>
  <text x="345" y="467" class="text"><tspan x="345" dy="0">无遮挡/轻微遮挡</tspan><tspan x="345" dy="28">直接进入方向估计</tspan></text>

  <rect x="640" y="440" width="250" height="86" class="box decision"/>
  <text x="765" y="467" class="text"><tspan x="765" dy="0">中度遮挡</tspan><tspan x="765" dy="28">先进行柔性游离</tspan></text>

  <rect x="1060" y="440" width="250" height="86" class="box risk"/>
  <text x="1185" y="467" class="text"><tspan x="1185" dy="0">重度遮挡</tspan><tspan x="1185" dy="28">暂不可强行套袋</tspan></text>

  <path class="arrow" d="M1580 288 V350 H345 V440"/>
  <text x="900" y="342" class="label">按遮挡程度分流</text>
  <path class="arrow" d="M1580 288 V350 H765 V440"/>
  <path class="arrow-red" d="M1580 288 V350 H1185 V440"/>

  <rect x="640" y="532" width="250" height="58" class="box decision"/>
  <text x="765" y="561" class="text">拨叶/轻推/托举</text>
  <path class="arrow" d="M765 526 V532"/>

  <rect x="1060" y="532" width="250" height="58" class="box risk"/>
  <text x="1185" y="561" class="text">换视角或人工补套</text>
  <path class="arrow-red" d="M1185 526 V532"/>

  <!-- Execution row -->
  <rect x="180" y="730" width="230" height="80" class="box sense"/>
  <text x="295" y="758" class="text"><tspan x="295" dy="0">果柄连接区估计</tspan><tspan x="295" dy="28">生成套袋方向</tspan></text>

  <rect x="520" y="730" width="230" height="80" class="box action"/>
  <text x="635" y="758" class="text"><tspan x="635" dy="0">机械臂低速接近</tspan><tspan x="635" dy="28">视觉伺服微调</tspan></text>

  <rect x="860" y="730" width="230" height="80" class="box action"/>
  <text x="975" y="758" class="text"><tspan x="975" dy="0">套袋头打开袋口</tspan><tspan x="975" dy="28">导向果实进入</tspan></text>

  <rect x="1200" y="730" width="230" height="80" class="box action"/>
  <text x="1315" y="758" class="text"><tspan x="1315" dy="0">合袋/收口/退出</tspan><tspan x="1315" dy="28">完成一次套袋</tspan></text>

  <rect x="1510" y="730" width="190" height="80" class="box sense"/>
  <text x="1605" y="758" class="text"><tspan x="1605" dy="0">套后视觉确认</tspan><tspan x="1605" dy="28">检测果袋覆盖</tspan></text>

  <path class="arrow" d="M345 526 V770 H180"/>
  <path class="arrow" d="M765 590 V676 H295 V730"/>
  <text x="490" y="656" class="label">游离后重新观察，若可见则进入套袋</text>
  <path class="arrow" d="M410 770 H520"/>
  <path class="arrow" d="M750 770 H860"/>
  <path class="arrow" d="M1090 770 H1200"/>
  <path class="arrow" d="M1430 770 H1510"/>

  <!-- Confirmation decision and update -->
  <polygon points="1605,930 1690,990 1605,1050 1520,990" class="box decision"/>
  <text x="1605" y="978" class="text"><tspan x="1605" dy="0">是否套袋</tspan><tspan x="1605" dy="26">成功?</tspan></text>
  <path class="arrow" d="M1605 810 V930"/>

  <rect x="1115" y="1008" width="270" height="62" class="box sense"/>
  <text x="1250" y="1039" class="text">更新已套/未套列表</text>
  <path class="arrow" d="M1520 990 H1385"/>
  <text x="1455" y="965" class="label">成功</text>

  <rect x="680" y="1008" width="280" height="62" class="box risk"/>
  <text x="820" y="1039" class="text">失败：重试/换视角/补套</text>
  <path class="arrow-red" d="M1605 1050 V1115 H820 V1070"/>
  <text x="1300" y="1110" class="label">失败</text>

  <path class="arrow" d="M1115 1039 H1000 V1125 H190 V266"/>
  <text x="570" y="1144" class="label">进入下一轮：重新采集图像并更新作业顺序</text>

  <path class="arrow-red" d="M1185 590 V936 H820 V1008"/>

  <!-- Legend -->
  <rect x="84" y="1012" width="430" height="68" rx="10" fill="#ffffff" stroke="#d6dee9"/>
  <rect x="110" y="1032" width="22" height="22" class="input" stroke="#94a3b8"/>
  <text x="146" y="1044" class="legend-text">视觉输入</text>
  <rect x="242" y="1032" width="22" height="22" class="sense" stroke="#94a3b8"/>
  <text x="278" y="1044" class="legend-text">感知/确认</text>
  <rect x="380" y="1032" width="22" height="22" class="decision" stroke="#94a3b8"/>
  <text x="416" y="1044" class="legend-text">决策/游离</text>
  <rect x="110" y="1060" width="22" height="22" class="action" stroke="#94a3b8"/>
  <text x="146" y="1072" class="legend-text">机械执行</text>
  <rect x="242" y="1060" width="22" height="22" class="risk" stroke="#94a3b8"/>
  <text x="278" y="1072" class="legend-text">失败/暂不可作业</text>
</svg>
