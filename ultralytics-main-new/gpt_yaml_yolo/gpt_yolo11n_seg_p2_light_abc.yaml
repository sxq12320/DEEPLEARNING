# GPT YOLO11n-seg P2 Light-ABC for watermelon flower segmentation.
# A: P2/4 segmentation branch for tiny flower masks.
# B: C3Ghost replaces C3k2 blocks to reduce parameters and computation.
# C: SCDown replaces deeper stride convolutions with separable downsampling.
# D: Smaller Segment head reduces mask prototype and coefficient cost.

nc: 5
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3Ghost, [256, False]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3Ghost, [512, False]] # 4
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3Ghost, [512, True]] # 6
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3Ghost, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3Ghost, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3Ghost, [256, False]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3Ghost, [128, False]] # 19 (P2/4-xsmall)

  - [-1, 1, SCDown, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3Ghost, [256, False]] # 22 (P3/8-small)

  - [-1, 1, SCDown, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3Ghost, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3Ghost, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Segment, [nc, 24, 192]] # Segment(P2, P3, P4, P5)
