# 消融实验 Group1-02：4通道早期融合基线 (RGB-D拼接输入, 单流YOLO11)
# 改进策略：将Depth通道与RGB拼接为4通道输入，使用标准YOLO11单流架构处理
# 训练命令示例：
#   yolo segment train model=02_baseline_early_fusion.yaml data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 输入：4通道 RGBD (channels=4)，RGB(3ch) + Depth(1ch) 在输入层拼接
#   - 主干网络：标准YOLO11 backbone (Conv + C3k2 + SPPF + C2PSA)
#     · 第一个Conv层接受4通道输入，网络其余部分完全不变
#     · 与ablation1_4ch_input.yaml架构完全一致
#   - 检测头：标准YOLO11 head (Upsample + Concat + C3k2)
#   - 无双分支，无融合模块 — Depth信息仅通过输入通道注入
#
# 层索引说明（from字段为层索引，-1表示上一层）：
#   Layer 0-10:  标准YOLO11 backbone (4ch输入)
#   Layer 11-21: YOLO11检测头 (FPN + PAN)
#   Layer 22:    Segment分割头
#
# 对比意义：
#   与01_baseline_rgb_only对比 → 验证简单添加Depth通道的增益
#   与03_baseline_naive_dual_stream对比 → 验证双流架构 vs 单流早期融合的优劣

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 标准主干网络 (4ch输入)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2  (4ch输入)
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4-P3/8 特征
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6-P4/16 特征
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10-P5/32 特征

# YOLO11 标准检测头 (FPN+PAN结构)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]           # 12-cat backbone P4
  - [-1, 2, C3k2, [512, False]]         # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]           # 15-cat backbone P3
  - [-1, 2, C3k2, [256, False]]         # 16-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]          # 17
  - [[-1, 13], 1, Concat, [1]]          # 18-cat head P4
  - [-1, 2, C3k2, [512, False]]         # 19-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]          # 20
  - [[-1, 10], 1, Concat, [1]]          # 21-cat head P5
  - [-1, 2, C3k2, [1024, True]]         # 22-P5/32-large

  - [[16, 19, 22], 1, Segment, [nc, 32, 256]] # 23-Segment(P3, P4, P5)
