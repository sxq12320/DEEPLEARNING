# 消融实验 2：RGB分支(YOLO11) + Depth分支(简单Conv下采样) + BypassModule融合
# 改进策略：RGB分支仍使用YOLO11架构，Depth仅使用Conv进行简单下采样保证尺寸大小一样
# 训练命令示例：
#   yolo detect train model=ablation2_rgb_conv_depth.yaml data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 输入：4通道 RGBD (channels=4)
#   - RGB分支：标准YOLO11 backbone，从layer 0开始，输出P3/P4/P5
#   - Depth分支：从layer 0输出分叉，4层Conv下采样至P3/P4/P5
#   - 融合方式：BypassModule（1x1投影+相加，无额外计算）
#
# 层索引说明（from字段为层索引，-1表示上一层）：
#   Layer 0-10:  RGB分支 (标准YOLO11 backbone)
#   Layer 11-14: Depth分支 (简单Conv下采样)
#   Layer 15-17: BypassModule融合 (P3/P4/P5)
#   Layer 18-30: YOLO11 head (使用融合后特征)

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (标准 YOLO11) ==========
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2  (4ch输入)
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4-P3/8 RGB特征
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6-P4/16 RGB特征
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10-P5/32 RGB特征

  # ========== Depth 分支 (简单Conv下采样) ==========
  # 从layer 0分叉，用Conv逐步下采样对齐P3/P4/P5尺寸
  - [0, 1, Conv, [128, 3, 2]]           # 11-Depth P2/4 (从layer0分叉)
  - [-1, 1, Conv, [256, 3, 2]]          # 12-Depth P3/8
  - [-1, 1, Conv, [512, 3, 2]]          # 13-Depth P4/16
  - [-1, 1, Conv, [512, 3, 2]]          # 14-Depth P5/32

  # ========== Bypass 融合 (简单投影+相加) ==========
  - [[4, 12], 1, BypassModule, []]      # 15-P3融合: RGB_P3 + Depth_P3
  - [[6, 13], 1, BypassModule, []]      # 16-P4融合: RGB_P4 + Depth_P4
  - [[10, 14], 1, BypassModule, []]     # 17-P5融合: RGB_P5 + Depth_P5

# YOLO11 head (使用融合后的特征)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 16], 1, Concat, [1]]          # 19-cat fused P4
  - [-1, 2, C3k2, [512, False]]         # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21
  - [[-1, 15], 1, Concat, [1]]          # 22-cat fused P3
  - [-1, 2, C3k2, [256, False]]         # 23-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]          # 24
  - [[-1, 20], 1, Concat, [1]]          # 25-cat head P4
  - [-1, 2, C3k2, [512, False]]         # 26-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]          # 27
  - [[-1, 17], 1, Concat, [1]]          # 28-cat fused P5
  - [-1, 2, C3k2, [1024, True]]         # 29-P5/32-large

  - [[23, 26, 29], 1, Detect, [nc]]     # 30-Detect(P3, P4, P5)
