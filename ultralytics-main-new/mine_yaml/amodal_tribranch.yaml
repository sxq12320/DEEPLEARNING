# Amodal Tri-Branch Segmentation Model Config
# Based on YOLO11-seg backbone + neck, with custom tri-branch head replacing Segment head
#
# 训练命令示例:
#   cd /workspace/amodal_tribranch
#   python train.py \
#     --model_yaml ../ultralytics-main-new/mine_yaml/amodal_tribranch.yaml \
#     --data_root /path/to/dataset \
#     --data_format npy \
#     --epochs 100 \
#     --batch_size 4 \
#     --lr 0.001
#
# 说明:
#   - channels=4: RGB(3ch) + Depth(1ch) 四通道输入
#   - nc=1: 单类 (如 apple)
#   - Segment head 在 AmodalYOLO 模型代码中被移除，替换为 TriBranchAmodalHead
#   - P3 特征图来自 layer 16 (stride=8)
#   - 支持 n/s/m/l/x 五种缩放

nc: 1
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10

# YOLO11n head (FPN + PAN)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                   # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                   # 16 (P3/8-small) ← TriBranchAmodalHead 接此层

  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1]]                    # 18 cat head P4
  - [-1, 2, C3k2, [512, False]]                   # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1]]                    # 21 cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 22 (P5/32-large)

  # Segment head — 此层会在 AmodalYOLO 中被移除并替换为 TriBranchAmodalHead
  # 保留此行是为了让 parse_model 正确计算通道数和 save list
  - [[16, 19, 22], 1, Segment, [nc, 32, 256]]    # 23 Segment(P3, P4, P5)
