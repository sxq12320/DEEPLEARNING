# 消融实验 3：RGB分支(YOLO11) + Depth分支(ShuffleNetV2 1.0x) + BypassModule融合
# 改进策略：RGB分支仍使用YOLO11架构，Depth分支使用ShuffleNetV2 1.0x进行特征提取
# 训练命令示例：
#   yolo detect train model=ablation3_rgb_shufflenet_depth.yaml data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 输入：4通道 RGBD (channels=4)
#   - RGB分支：标准YOLO11 backbone，输出P3/P4/P5
#   - Depth分支：从layer 0分叉，ShuffleV2Stem_Depth + Conv + ShuffleV2Stage
#     · ShuffleV2Stem_Depth: 从P1/2下采样至P3/8 (stride=4)
#     · Conv 1x1: 增加通道至116 (对齐ShuffleNetV2 stage2配置)
#     · ShuffleV2Stage [232,8]: P3/8→P4/16, 232ch
#     · ShuffleV2Stage [464,4]: P4/16→P5/32, 464ch
#   - 融合方式：BypassModule（1x1投影+相加）
#
# ShuffleNetV2 1.0x 通道配置: stem→24, stage2→116, stage3→232, stage4→464
# 注意：ShuffleNetV2的通道数不受width_multiple缩放

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (标准 YOLO11) ==========
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2  (4ch输入)
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4-P3/8 RGB特征
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6-P4/16 RGB特征
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10-P5/32 RGB特征

  # ========== Depth 分支 (ShuffleNetV2 1.0x) ==========
  # 从layer 0分叉，使用ShuffleNetV2提取深度特征
  - [0, 1, ShuffleV2Stem_Depth, [24]]   # 11-Depth Stem: P1/2→P3/8, 24ch
  - [-1, 1, Conv, [116, 1, 1]]          # 12-Depth P3/8, 116ch (1x1扩展通道)
  - [-1, 1, ShuffleV2Stage, [232, 8]]   # 13-Depth P4/16, 232ch (stage3配置)
  - [-1, 1, ShuffleV2Stage, [464, 4]]   # 14-Depth P5/32, 464ch (stage4配置)

  # ========== Bypass 融合 (简单投影+相加) ==========
  - [[4, 12], 1, BypassModule, []]      # 15-P3融合: RGB_P3(512) + Depth_P3(116)
  - [[6, 13], 1, BypassModule, []]      # 16-P4融合: RGB_P4(512) + Depth_P4(232)
  - [[10, 14], 1, BypassModule, []]     # 17-P5融合: RGB_P5(1024) + Depth_P5(464)

# YOLO11 head (使用融合后的特征)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 16], 1, Concat, [1]]          # 19-cat fused P4
  - [-1, 2, C3k2, [512, False]]         # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21
  - [[-1, 15], 1, Concat, [1]]          # 22-cat fused P3
  - [-1, 2, C3k2, [256, False]]         # 23-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]          # 24
  - [[-1, 20], 1, Concat, [1]]          # 25-cat head P4
  - [-1, 2, C3k2, [512, False]]         # 26-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]          # 27
  - [[-1, 17], 1, Concat, [1]]          # 28-cat fused P5
  - [-1, 2, C3k2, [1024, True]]         # 29-P5/32-large

  - [[23, 26, 29], 1, Detect, [nc]]     # 30-Detect(P3, P4, P5)
