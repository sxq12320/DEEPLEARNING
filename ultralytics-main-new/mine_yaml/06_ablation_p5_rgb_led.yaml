# 消融实验 Group2-06：P5 尺度感知策略剥离 — 仅P5启用RGB-led
# 改进策略：在MobileNetV3+StarNet双分支架构上，仅P5层启用RGB-led融合，P3/P4使用Naive基线融合
# 训练命令示例：
#   yolo segment train model=06_ablation_p5_rgb_led.yaml data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 输入：4通道 RGBD (channels=4)
#   - RGB分支：MobileNet V3-Large (轻量高效，适合RGB纹理特征提取)
#     · MobileNetV3Stem_RGB: 4ch输入→16ch, P1/2下采样
#     · MobileNetV3Stage: 逐级提取P2→P3→P4特征
#     · Conv+SPPF: 生成P5深层特征
#   - Depth分支：StarNet (星形拓扑，适合深度几何结构提取)
#     · StarNetStem_Depth: 从Stem输出分叉，直接到P3/8尺度
#     · StarNetStage: 逐级提取P4→P5深度特征
#   - 尺度感知融合策略（本实验配置）：
#     · P3浅层: ScaleAwareFusion_Naive [128ch] — 基线Concat+1x1Conv融合
#       不使用任何尺度感知策略，仅做简单拼接和通道对齐
#     · P4中层: ScaleAwareFusion_Naive [256ch] — 基线Concat+1x1Conv融合
#       不使用任何尺度感知策略，仅做简单拼接和通道对齐
#     · P5深层: ScaleAwareFusion_RGBLed [512ch] — RGB-led几何先验融合
#       核心思想：深层语义抽象，RGB主导全局语义，Depth提供几何先验补充
#       机制：通道聚合Squeeze(channel aggregation Squeeze) → 通道扩散Excitation(channel diffusion Excitation)
#       RGB特征作为主导信号，通过Squeeze压缩Depth几何信息为通道描述符，
#       再通过Excitation将几何先验注入RGB通道，实现语义增强
#
# 消融目的：
#   验证P5层RGB-led几何先验融合策略的独立贡献
#   与Group2其他实验对比，可量化每个尺度感知模块的增益
#
# 层索引说明：
#   Layer 0-5:  RGB分支 (MobileNet V3-Large)
#   Layer 6-8:  Depth分支 (StarNet)
#   Layer 9-11: 尺度感知融合 (P3/P4=Naive, P5=RGBLed)
#   Layer 12-24: YOLO11 Head (Segment分割头)

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (MobileNet V3-Large) ==========
  # [from, repeats, module, args]
  - [-1, 1, MobileNetV3Stem_RGB, [16]]    # 0-P1/2: 16ch, 320x320 (4ch输入)
  - [-1, 1, MobileNetV3Stage, [24]]        # 1-P2/4: 24ch, 160x160
  - [-1, 1, MobileNetV3Stage, [40]]        # 2-P3/8: 40ch, 80x80 ← RGB P3
  - [-1, 1, MobileNetV3Stage, [160]]       # 3-P4/16: 160ch, 40x40 ← RGB P4
  - [-1, 1, Conv, [512, 3, 2]]            # 4-P5/32: 512ch, 20x20
  - [-1, 1, SPPF, [512, 5]]               # 5-P5/32: 512ch, 20x20 ← RGB P5

  # ========== Depth 分支 (StarNet) ==========
  # 从layer 0输出分叉，StarNet提取深度几何特征
  - [0, 1, StarNetStem_Depth, [32]]        # 6-P3/8: 32ch, 80x80 ← Depth P3
  - [-1, 1, StarNetStage, [64, 2]]         # 7-P4/16: 64ch, 40x40 ← Depth P4
  - [-1, 1, StarNetStage, [128, 2]]        # 8-P5/32: 128ch, 20x20 ← Depth P5

  # ========== 尺度感知融合 (P3/P4=Naive, P5=RGBLed) ==========
  # P3浅层: Naive基线融合 (无尺度感知)
  - [[2, 6], 1, ScaleAwareFusion_Naive, [128]]       # 9-P3融合: Naive(RGB_P3, Depth_P3) → 128ch
  # P4中层: Naive基线融合 (无尺度感知)
  - [[3, 7], 1, ScaleAwareFusion_Naive, [256]]       # 10-P4融合: Naive(RGB_P4, Depth_P4) → 256ch
  # P5深层: RGB-led几何先验融合
  #   深层特征高度语义抽象，RGB主导全局语义理解，Depth提供几何先验补充：
  #   1. 通道聚合Squeeze: 将Depth几何信息压缩为通道级描述符
  #   2. 通道扩散Excitation: 将几何先验以通道注意力形式注入RGB特征
  #   RGB-led意味着RGB特征为主导信号，Depth几何信息通过SE-like机制增强RGB
  - [[5, 8], 1, ScaleAwareFusion_RGBLed, [512]]      # 11-P5融合: RGBLed(RGB_P5, Depth_P5) → 512ch

# YOLO11 Head (使用融合后的特征)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 12
  - [[-1, 10], 1, Concat, [1]]                        # 13-cat fused P4 (256+256=512)
  - [-1, 2, C3k2, [256, False]]                       # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 15
  - [[-1, 9], 1, Concat, [1]]                         # 16-cat fused P3 (128+128=256)
  - [-1, 2, C3k2, [128, False]]                       # 17-P3/8-small

  - [-1, 1, Conv, [128, 3, 2]]                        # 18
  - [[-1, 14], 1, Concat, [1]]                        # 19-cat head P4 (128+256=384)
  - [-1, 2, C3k2, [256, False]]                       # 20-P4/16-medium

  - [-1, 1, Conv, [256, 3, 2]]                        # 21
  - [[-1, 11], 1, Concat, [1]]                        # 22-cat fused P5 (256+512=768)
  - [-1, 2, C3k2, [512, True]]                        # 23-P5/32-large

  - [[17, 20, 23], 1, Segment, [nc, 32, 256]]        # 24-Segment(P3, P4, P5)
