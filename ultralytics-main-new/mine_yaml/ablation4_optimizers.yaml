# 消融实验 4：优化器改进 (PIDAO / SMC)
# 改进策略：在实验3的架构基础上，测试两种新型优化器
# 训练命令示例：
#   PIDAO优化器: yolo detect train model=ablation4_optimizers.yaml optimizer=PIDAO data=your_rgd_data.yaml epochs=100
#   SMC优化器:   yolo detect train model=ablation4_optimizers.yaml optimizer=SMC data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 模型架构与实验3完全相同 (RGB分支 + ShuffleNetV2 Depth分支 + BypassModule融合)
#   - 优化器改进是训练策略层面的变化，不影响模型结构
#   - PIDAO: 多通道高阶PID优化器，支持1/2/3阶微分通道，利用二项式系数计算高阶差分
#   - SMC:   滑模控制优化器，底层AdamW + SMCScheduler动态调节LR和动量
#            基于滑模面停滞检测触发escape模式(梯度噪声注入+LR提升+β₁微调)
#
# 建议分别运行两次实验，对比PIDAO和SMC的效果：
#   实验4a: optimizer=PIDAO
#   实验4b: optimizer=SMC

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (标准 YOLO11) ==========
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2  (4ch输入)
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4-P3/8 RGB特征
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6-P4/16 RGB特征
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10-P5/32 RGB特征

  # ========== Depth 分支 (ShuffleNetV2 1.0x) ==========
  - [0, 1, ShuffleV2Stem_Depth, [24]]   # 11-Depth Stem: P1/2→P3/8, 24ch
  - [-1, 1, Conv, [116, 1, 1]]          # 12-Depth P3/8, 116ch
  - [-1, 1, ShuffleV2Stage, [232, 8]]   # 13-Depth P4/16, 232ch
  - [-1, 1, ShuffleV2Stage, [464, 4]]   # 14-Depth P5/32, 464ch

  # ========== Bypass 融合 ==========
  - [[4, 12], 1, BypassModule, []]      # 15-P3融合
  - [[6, 13], 1, BypassModule, []]      # 16-P4融合
  - [[10, 14], 1, BypassModule, []]     # 17-P5融合

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 16], 1, Concat, [1]]          # 19-cat fused P4
  - [-1, 2, C3k2, [512, False]]         # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21
  - [[-1, 15], 1, Concat, [1]]          # 22-cat fused P3
  - [-1, 2, C3k2, [256, False]]         # 23-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]          # 24
  - [[-1, 20], 1, Concat, [1]]          # 25-cat head P4
  - [-1, 2, C3k2, [512, False]]         # 26-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]          # 27
  - [[-1, 17], 1, Concat, [1]]          # 28-cat fused P5
  - [-1, 2, C3k2, [1024, True]]         # 29-P5/32-large

  - [[23, 26, 29], 1, Detect, [nc]]     # 30-Detect(P3, P4, P5)
