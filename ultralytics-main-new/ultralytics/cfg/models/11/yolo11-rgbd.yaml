# YOLO11-RGBD: Custom RGB-D Apple Amodal Detection model
# Uses SFM (backbone), WCAF (neck fusion), DGFFN (FFN replacement)
# No Transformers / Mamba — Pure CNN + Frequency Domain + Dynamic Gating

# Parameters
nc: 80  # number of classes (adjust for apple amodal dataset)
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# RGB branch backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, SFM, [256]]              # 2-SFM replaces C3k2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, SFM, [512]]              # 4-SFM replaces C3k2
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, SFM, [512]]              # 6-SFM replaces C3k2
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, SFM, [1024]]             # 8-SFM replaces C3k2
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10

# Head with WCAF fusion and DGFFN
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, WCAF, []]                       # 12-WCAF replaces Concat (RGB+Depth fusion)
  - [-1, 2, DGFFN, [512]]                        # 13-DGFFN replaces C3k2 FFN

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, WCAF, []]                       # 15-WCAF replaces Concat
  - [-1, 2, DGFFN, [256]]                        # 16-DGFFN (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, WCAF, []]                      # 18-WCAF replaces Concat
  - [-1, 2, DGFFN, [512]]                        # 19-DGFFN (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, WCAF, []]                      # 21-WCAF replaces Concat
  - [-1, 2, DGFFN, [1024]]                       # 22-DGFFN (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]              # Detect(P3, P4, P5)
