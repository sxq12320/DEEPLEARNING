# SHR Watermelon Flower Pose Dataset
# 5 classes (flower types), 1 keypoint per object (蕊心), visibility flag
# bbox derived from segmentation polygons, keypoint from pose JSON

path: E:/mastercode/data/shr_watermelon/pose/yolo

train: train/images
val: val/images
test: test/images

nc: 5
names: ["blooming_male", "unknown", "closed_male", "blooming_female", "closed_female"]

kpt_shape: [1, 3]  # 1 keypoint, 3 dims (x, y, visibility: 0=not_labeled, 1=labeled_occluded, 2=labeled_visible)
flip_idx: [0]
