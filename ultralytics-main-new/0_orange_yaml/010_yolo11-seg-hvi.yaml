# YOLO11-seg + HVIEnhance region-gated low-light enhancement FRONT-END (layer 0).
# HVIEnhance runs on the raw 3-ch input image (RGB, [0,1]) and outputs a 3-ch
# enhanced image at the same resolution, then the normal YOLO11-seg backbone runs.
#
# NOTE: inserting a layer at index 0 shifts every downstream layer by +1, so all
# absolute `from` indices below are the 001 baseline indices + 1. Transfer COCO
# weights with train_citrus_seg_hvi.py (index-shift-aware loader) to keep the
# ablation vs 001_yolo11-seg.yaml fair.

# Parameters
nc: 80 # number of classes (overridden by the dataset YAML, e.g. nc=1 for citrus)
scales: # model compound scaling constants, i.e. 'model=yolo11n-seg.yaml' will call yolo11-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (+ HVIEnhance front-end)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, HVIEnhance, [16, 2]] # 0 low-light HVI enhancement (3->3): args=[base, blocks]
  - [-1, 1, Conv, [64, 3, 2]] # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 3
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

# YOLO11n head (absolute indices = baseline + 1)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 7], 1, Concat, [1]] # 13 cat backbone P4 (baseline 6 -> 7)
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16 cat backbone P3 (baseline 4 -> 5)
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19 cat head P4 (baseline 13 -> 14)
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22 cat head P5 (baseline 10 -> 11)
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Segment, [nc, 32, 256]] # 24 Segment(P3, P4, P5) (baseline 16,19,22 -> 17,20,23)
