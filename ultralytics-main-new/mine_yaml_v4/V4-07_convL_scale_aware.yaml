# ==============================================================================
# MobileNetV4-Conv-L(RGB) + StarNet(Depth) + Scale-Aware融合
# ==============================================================================
# 改进策略：使用MobileNetV4-Conv-L（更大容量）替换Conv-M作为RGB主干，配合Scale-Aware融合
# 训练命令：yolo segment train model=V4-07_convL_scale_aware.yaml data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 输入：4通道 RGBD (channels=4)
#   - RGB分支：MobileNetV4-Conv-L (更大容量的UIB主干)，输出P3/P4/P5
#     · MobileNetV4Stem_RGB: 4ch输入→32ch, stride=2, 320×320 (P1/2)
#     · MobileNetV4Stage [32, 'conv_l']: 32→32ch, stride=2, 160×160 (P2/4)
#     · MobileNetV4Stage [80, 'conv_l']: 32→80ch, stride=2, 80×80 (P3/8) ← RGB P3
#     · MobileNetV4Stage [160, 'conv_l']: 80→160ch, stride=2, 40×40 (P4/16) ← RGB P4
#     · Conv [512, 3, 2]: 160→512ch, stride=2, 20×20 (P5/32)
#     · SPPF [512, 5]: 512ch, 20×20 ← RGB P5
#   - Depth分支：StarNet，从layer 0分叉，输出P3/P4/P5
#     · StarNetStem_Depth [32]: 32→32ch, stride=4, 80×80 (P3/8) ← Depth P3
#     · StarNetStage [64, 2]: 32→64ch, stride=2, 40×40 (P4/16) ← Depth P4
#     · StarNetStage [128, 2]: 64→128ch, stride=2, 20×20 (P5/32) ← Depth P5
#   - 尺度感知融合策略（完整三层级化配置）：
#     · P3浅层: ScaleAwareFusion_Depth2RGB [128ch] — Depth-to-RGB空间引导
#     · P4中层: ScaleAwareFusion_Bidirectional [256ch] — 双向交叉注意力融合
#     · P5深层: ScaleAwareFusion_RGBLed [512ch] — RGB-led几何先验融合
#
# Conv-L vs Conv-M 对比：
#   ┌────────────┬───────────────┬───────────────┐
#   │  属性       │  Conv-M       │  Conv-L       │
#   ├────────────┼───────────────┼───────────────┤
#   │  P3通道     │  64ch         │  80ch         │
#   │  P4通道     │  96ch         │  160ch        │
#   │  P5通道     │  512ch        │  512ch        │
#   │  UIB配置    │  Medium       │  Large        │
#   │  参数量     │  较少         │  较多         │
#   │  精度       │  基线         │  更高         │
#   └────────────┴───────────────┴───────────────┘
#
# 层索引说明：
#   Layer 0-5:  RGB分支 (MobileNetV4-Conv-L)
#   Layer 6-8:  Depth分支 (StarNet)
#   Layer 9-11: 尺度感知融合 (P3=Depth2RGB, P4=Bidirectional, P5=RGBLed)
#   Layer 12-24: YOLO11 Head (Segment分割头)

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (MobileNetV4-Conv-L) ==========
  # [from, repeats, module, args]
  - [-1, 1, MobileNetV4Stem_RGB, []]              # 0-P1/2  4ch→32ch, 320×320
  - [-1, 1, MobileNetV4Stage, [32, 'conv_l']]      # 1-P2/4  32→32ch, 160×160
  - [-1, 1, MobileNetV4Stage, [80, 'conv_l']]      # 2-P3/8  32→80ch, 80×80 ← RGB P3
  - [-1, 1, MobileNetV4Stage, [160, 'conv_l']]     # 3-P4/16 80→160ch, 40×40 ← RGB P4
  - [-1, 1, Conv, [512, 3, 2]]                    # 4-P5/32 160→512ch, 20×20
  - [-1, 1, SPPF, [512, 5]]                       # 5       512ch, 20×20 ← RGB P5

  # ========== Depth 分支 (StarNet) ==========
  # 从layer 0输出分叉，StarNet提取深度几何特征
  - [0, 1, StarNetStem_Depth, [32]]        # 6-P3/8: 32ch, 80×80 ← Depth P3
  - [-1, 1, StarNetStage, [64, 2]]         # 7-P4/16: 64ch, 40×40 ← Depth P4
  - [-1, 1, StarNetStage, [128, 2]]        # 8-P5/32: 128ch, 20×20 ← Depth P5

  # ========== 尺度感知融合 (完整三层级化配置) ==========
  # P3浅层: Depth-to-RGB空间引导融合
  #   Conv-L P3=80ch + Depth P3=32ch → 128ch
  - [[2, 6], 1, ScaleAwareFusion_Depth2RGB, [128]]   # 9-P3融合: Depth2RGB(RGB_P3, Depth_P3) → 128ch
  # P4中层: 双向交叉注意力融合
  #   Conv-L P4=160ch + Depth P4=64ch → 256ch
  - [[3, 7], 1, ScaleAwareFusion_Bidirectional, [256]] # 10-P4融合: Bidirectional(RGB_P4, Depth_P4) → 256ch
  # P5深层: RGB-led几何先验融合
  #   Conv-L P5=512ch + Depth P5=128ch → 512ch
  - [[5, 8], 1, ScaleAwareFusion_RGBLed, [512]]      # 11-P5融合: RGBLed(RGB_P5, Depth_P5) → 512ch

# YOLO11 Head (使用融合后的特征，融合输出通道与Conv-M版本一致: 128/256/512)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 12
  - [[-1, 10], 1, Concat, [1]]                        # 13-cat fused P4 (256+256=512)
  - [-1, 2, C3k2, [256, False]]                       # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 15
  - [[-1, 9], 1, Concat, [1]]                         # 16-cat fused P3 (128+128=256)
  - [-1, 2, C3k2, [128, False]]                       # 17-P3/8-small

  - [-1, 1, Conv, [128, 3, 2]]                        # 18
  - [[-1, 14], 1, Concat, [1]]                        # 19-cat head P4 (128+256=384)
  - [-1, 2, C3k2, [256, False]]                       # 20-P4/16-medium

  - [-1, 1, Conv, [256, 3, 2]]                        # 21
  - [[-1, 11], 1, Concat, [1]]                        # 22-cat fused P5 (256+512=768)
  - [-1, 2, C3k2, [512, True]]                        # 23-P5/32-large

  - [[17, 20, 23], 1, Segment, [nc, 32, 256]]        # 24-Segment(P3, P4, P5)
