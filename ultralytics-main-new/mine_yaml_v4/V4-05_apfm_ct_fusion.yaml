# ==============================================================================
# MobileNetV4-Conv-M(RGB) + StarNet(Depth) + APFM预融合 + CT融合
# ==============================================================================
# 改进策略：异构双流架构 + APFM注意力预融合 + CT控制理论融合策略
# 训练命令：yolo segment train model=V4-05_apfm_ct_fusion.yaml data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 输入：4通道 RGBD (channels=4)
#   - RGB分支：MobileNetV4-Conv-M 轻量主干，输出P3/P4/P5
#     · MobileNetV4Stem_RGB: 4ch→32ch, stride=2, 320×320 (P1/2)
#     · MobileNetV4Stage [32]: 32→32ch, 160×160 (P2/4)
#     · MobileNetV4Stage [64]: 32→64ch, 80×80 (P3/8) ← RGB P3
#     · MobileNetV4Stage [96]: 64→96ch, 40×40 (P4/16) ← RGB P4
#     · Conv [512,3,2]: 96→512ch, 20×20 (P5/32)
#     · SPPF [512,5]: 512ch, 20×20 ← RGB P5
#   - Depth分支：StarNet 星型操作主干，输出P3/P4/P5
#     · StarNetStem_Depth [32]: 32→32ch, stride=4, 80×80 (P3/8) ← Depth P3
#     · StarNetStage [64,2]: 32→64ch, 40×40 (P4/16) ← Depth P4
#     · StarNetStage [128,2]: 64→128ch, 20×20 (P5/32) ← Depth P5
#   - APFM 预融合（层级化，位于 CT 融合模块之前）：
#     · APFM 同时建模 Channel-wise 和 Spatial-wise 注意力
#     · 对两路互补特征进行自适应加权融合，生成注意力权重 w
#     · Ff = w * FA + (1 - w) * FB
#     · APFM_P3 = APFM(RGB_P3, Depth_P3) → 64ch
#     · APFM_P4 = APFM(RGB_P4, APFM_P3) → 96ch (层级化：RGB_P4与APFM_P3融合)
#     · APFM_P5 = APFM(RGB_P5, APFM_P4) → 512ch (层级化：RGB_P5与APFM_P4融合)
#   - CT 控制理论融合（使用 APFM 输出作为第二路输入）：
#     · P3浅层: KalmanGatedFusion(RGB_P3, APFM_P3) → 64ch
#       卡尔曼增益融合，APFM_P3替代原始Depth_P3作为指导信号
#     · P4中层: ESOFusion(RGB_P4, APFM_P4) → 96+96=192ch
#       ESO扰动补偿融合，APFM_P4替代Fused_P3作为控制量
#       输出 = cat(f_clean, APFM_P4)，通道数 = c_p4_rgb + c_apfm_p4
#     · P5深层: IDAPBCFusion(RGB_P5, APFM_P5) → 512ch
#       IDA-PBC能量成型融合，APFM_P5替代Fused_P4作为几何先验
#
# 融合层级关系（两阶段：APFM预融合 → CT融合）：
#   阶段1 - APFM预融合（自底向上层级化）：
#     APFM(RGB_P3, Depth_P3) → APFM_P3 (64ch)
#     APFM(RGB_P4, APFM_P3)  → APFM_P4 (96ch)
#     APFM(RGB_P5, APFM_P4)  → APFM_P5 (512ch)
#   阶段2 - CT控制理论融合（使用APFM输出）：
#     KalmanGatedFusion(RGB_P3, APFM_P3) → Fused_P3 (64ch)
#     ESOFusion(RGB_P4, APFM_P4)         → Fused_P4 (192ch)
#     IDAPBCFusion(RGB_P5, APFM_P5)      → Fused_P5 (512ch)
# ==============================================================================

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (MobileNetV4-Conv-M) ==========
  # [from, repeats, module, args]
  - [-1, 1, MobileNetV4Stem_RGB, []]      # 0-P1/2: 32ch, 320×320
  - [-1, 1, MobileNetV4Stage, [32]]        # 1-P2/4: 32ch, 160×160
  - [-1, 1, MobileNetV4Stage, [64]]        # 2-P3/8: 64ch, 80×80 ← RGB P3
  - [-1, 1, MobileNetV4Stage, [96]]        # 3-P4/16: 96ch, 40×40 ← RGB P4
  - [-1, 1, Conv, [512, 3, 2]]            # 4-P5/32: 512ch, 20×20
  - [-1, 1, SPPF, [512, 5]]               # 5-P5/32: 512ch, 20×20 ← RGB P5

  # ========== Depth 分支 (StarNet) ==========
  # 从 layer 0 分叉，StarNet提取深度特征
  - [0, 1, StarNetStem_Depth, [32]]        # 6-P3/8: 32ch, 80×80 ← Depth P3
  - [-1, 1, StarNetStage, [64, 2]]         # 7-P4/16: 64ch, 40×40 ← Depth P4
  - [-1, 1, StarNetStage, [128, 2]]        # 8-P5/32: 128ch, 20×20 ← Depth P5

  # ========== APFM 预融合 (层级化，位于 CT 融合之前) ==========
  # APFM: Attention Parallel Feature Mixer，自适应加权融合两路特征
  # 输出通道 = 第一路输入通道 (ch[f[0]])
  - [[2, 6], 1, APFM, []]                  # 9-APFM(RGB_P3, Depth_P3) → 64ch (APFM_P3)
  - [[3, 9], 1, APFM, []]                  # 10-APFM(RGB_P4, APFM_P3) → 96ch (APFM_P4)
  - [[5, 10], 1, APFM, []]                 # 11-APFM(RGB_P5, APFM_P4) → 512ch (APFM_P5)

  # ========== CT 控制理论融合 (使用 APFM 输出作为第二路输入) ==========
  # P3浅层: 卡尔曼增益融合 (第二路输入为 APFM_P3，替代原始 Depth_P3)
  - [[2, 9], 1, KalmanGatedFusion, []]     # 12-P3融合: Kalman(RGB_P3, APFM_P3) → 64ch
  # P4中层: ESO扰动补偿融合 (第二路输入为 APFM_P4，替代 Fused_P3)
  # 输出 = cat(f_clean, APFM_P4)，通道数 = c_p4_rgb + c_apfm_p4
  - [[3, 10], 1, ESOFusion, []]            # 13-P4融合: ESO(RGB_P4, APFM_P4) → 96+96=192ch
  # P5深层: IDA-PBC能量成型融合 (第二路输入为 APFM_P5，替代 Fused_P4)
  - [[5, 11], 1, IDAPBCFusion, []]         # 14-P5融合: IDAPBC(RGB_P5, APFM_P5) → 512ch

# 检测头 (适配APFM+CT融合输出通道)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15: 512ch, 40×40
  - [[-1, 13], 1, Concat, [1]]            # 16-cat ESO P4: 512+192=704ch
  - [-1, 2, C3k2, [256, False]]           # 17: 256ch

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18: 256ch, 80×80
  - [[-1, 12], 1, Concat, [1]]            # 19-cat Kalman P3: 256+64=320ch
  - [-1, 2, C3k2, [128, False]]           # 20-P3/8-small: 128ch

  - [-1, 1, Conv, [128, 3, 2]]            # 21: 128ch, 40×40
  - [[-1, 17], 1, Concat, [1]]            # 22-cat head P4: 128+256=384ch
  - [-1, 2, C3k2, [256, False]]           # 23-P4/16-medium: 256ch

  - [-1, 1, Conv, [256, 3, 2]]            # 24: 256ch, 20×20
  - [[-1, 14], 1, Concat, [1]]            # 25-cat IDAPBC P5: 256+512=768ch
  - [-1, 2, C3k2, [512, True]]            # 26-P5/32-large: 512ch

  - [[20, 23, 26], 1, Segment, [nc, 32, 256]] # 27-Segment(P3, P4, P5)
