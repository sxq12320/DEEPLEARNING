# 消融实验 V4-09：P4 尺度感知策略剥离 — 仅P4启用Bidirectional
# 改进策略：在MobileNetV4-Conv-M+StarNet双分支架构上，仅P4层启用Bidirectional融合，P3/P5使用Naive基线融合
# 训练命令：yolo segment train model=V4-09_p4_bidirectional_ablation.yaml data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 输入：4通道 RGBD (channels=4)
#   - RGB分支：MobileNetV4-Conv-M (UIB统一倒置瓶颈，适合RGB纹理特征提取)
#     · MobileNetV4Stem_RGB: 4ch输入→32ch, P1/2下采样
#     · MobileNetV4Stage: 逐级提取P2→P3→P4特征
#     · Conv+SPPF: 生成P5深层特征
#   - Depth分支：StarNet (星形拓扑，适合深度几何结构提取)
#     · StarNetStem_Depth: 从Stem输出分叉，直接到P3/8尺度
#     · StarNetStage: 逐级提取P4→P5深度特征
#   - 尺度感知融合策略（本实验配置）：
#     · P3浅层: ScaleAwareFusion_Naive [128ch] — 基线Concat+1x1Conv融合
#       不使用任何尺度感知策略，仅做简单拼接和通道对齐
#     · P4中层: ScaleAwareFusion_Bidirectional [256ch] — 双向交叉注意力融合
#       核心思想：中层特征既有纹理又有结构，需要RGB和Depth双向交互
#       机制：交叉聚合(cross aggregation) → 残差扩散(residual diffusion) + 自适应门控(adaptive gate)
#       RGB→Depth和Depth→RGB双向交叉注意力，残差连接保留原始特征，
#       自适应门控动态平衡融合比例，避免模态冲突
#     · P5深层: ScaleAwareFusion_Naive [512ch] — 基线Concat+1x1Conv融合
#       不使用任何尺度感知策略，仅做简单拼接和通道对齐
#
# 消融目的：
#   验证P4层双向交叉注意力融合策略的独立贡献
#   与V4-03/V4-08/V4-10对比，可量化每个尺度感知模块的增益
#
# 层索引说明：
#   Layer 0-5:  RGB分支 (MobileNetV4-Conv-M)
#   Layer 6-8:  Depth分支 (StarNet)
#   Layer 9-11: 尺度感知融合 (P3/P5=Naive, P4=Bidirectional)
#   Layer 12-24: YOLO11 Head (Segment分割头)

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (MobileNetV4-Conv-M) ==========
  # [from, repeats, module, args]
  - [-1, 1, MobileNetV4Stem_RGB, []]      # 0-P1/2  4ch→32ch, 320×320
  - [-1, 1, MobileNetV4Stage, [32]]        # 1-P2/4  32→32ch, 160×160
  - [-1, 1, MobileNetV4Stage, [64]]        # 2-P3/8  32→64ch, 80×80 ← RGB P3
  - [-1, 1, MobileNetV4Stage, [96]]        # 3-P4/16 64→96ch, 40×40 ← RGB P4
  - [-1, 1, Conv, [512, 3, 2]]            # 4-P5/32 96→512ch, 20×20
  - [-1, 1, SPPF, [512, 5]]               # 5       512ch, 20×20 ← RGB P5

  # ========== Depth 分支 (StarNet) ==========
  # 从layer 0输出分叉，StarNet提取深度几何特征
  - [0, 1, StarNetStem_Depth, [32]]        # 6-P3/8: 32ch, 80×80 ← Depth P3
  - [-1, 1, StarNetStage, [64, 2]]         # 7-P4/16: 64ch, 40×40 ← Depth P4
  - [-1, 1, StarNetStage, [128, 2]]        # 8-P5/32: 128ch, 20×20 ← Depth P5

  # ========== 尺度感知融合 (P3/P5=Naive, P4=Bidirectional) ==========
  # P3浅层: Naive基线融合 (无尺度感知)
  - [[2, 6], 1, ScaleAwareFusion_Naive, [128]]       # 9-P3融合: Naive(RGB_P3, Depth_P3) → 128ch
  # P4中层: 双向交叉注意力融合
  #   RGB和Depth在中层均含有丰富语义，需要双向交叉建模：
  #   1. 交叉聚合(cross aggregation): RGB→Depth和Depth→RGB双向交叉注意力
  #   2. 残差扩散(residual diffusion): 融合结果与原始特征残差连接
  #   3. 自适应门控(adaptive gate): 动态学习RGB和Depth的融合权重，避免模态冲突
  - [[3, 7], 1, ScaleAwareFusion_Bidirectional, [256]] # 10-P4融合: Bidirectional(RGB_P4, Depth_P4) → 256ch
  # P5深层: Naive基线融合 (无尺度感知)
  - [[5, 8], 1, ScaleAwareFusion_Naive, [512]]       # 11-P5融合: Naive(RGB_P5, Depth_P5) → 512ch

# YOLO11 Head (使用融合后的特征)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 12
  - [[-1, 10], 1, Concat, [1]]                        # 13-cat fused P4 (256+256=512)
  - [-1, 2, C3k2, [256, False]]                       # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 15
  - [[-1, 9], 1, Concat, [1]]                         # 16-cat fused P3 (128+128=256)
  - [-1, 2, C3k2, [128, False]]                       # 17-P3/8-small

  - [-1, 1, Conv, [128, 3, 2]]                        # 18
  - [[-1, 14], 1, Concat, [1]]                        # 19-cat head P4 (128+256=384)
  - [-1, 2, C3k2, [256, False]]                       # 20-P4/16-medium

  - [-1, 1, Conv, [256, 3, 2]]                        # 21
  - [[-1, 11], 1, Concat, [1]]                        # 22-cat fused P5 (256+512=768)
  - [-1, 2, C3k2, [512, True]]                        # 23-P5/32-large

  - [[17, 20, 23], 1, Segment, [nc, 32, 256]]        # 24-Segment(P3, P4, P5)
