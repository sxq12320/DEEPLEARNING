# ==============================================================================
# MobileNetV4-Conv-M(RGB) + StarNet(Depth) + CT控制理论融合
# ==============================================================================
# 改进策略：异构双流架构 + 层级化控制理论(CT)融合策略
# 训练命令：yolo segment train model=V4-04_ct_fusion.yaml data=your_rgd_data.yaml epochs=100
#
# 架构说明：
#   - 输入：4通道 RGBD (channels=4)
#   - RGB分支：MobileNetV4-Conv-M 轻量主干，输出P3/P4/P5
#     · MobileNetV4Stem_RGB: 4ch→32ch, stride=2, 320×320 (P1/2)
#     · MobileNetV4Stage [32]: 32→32ch, 160×160 (P2/4)
#     · MobileNetV4Stage [64]: 32→64ch, 80×80 (P3/8) ← RGB P3
#     · MobileNetV4Stage [96]: 64→96ch, 40×40 (P4/16) ← RGB P4
#     · Conv [512,3,2]: 96→512ch, 20×20 (P5/32)
#     · SPPF [512,5]: 512ch, 20×20 ← RGB P5
#   - Depth分支：StarNet 星型操作主干，输出P3/P4/P5
#     · StarNetStem_Depth [32]: 32→32ch, stride=4, 80×80 (P3/8) ← Depth P3
#     · StarNetStage [64,2]: 32→64ch, 40×40 (P4/16) ← Depth P4
#     · StarNetStage [128,2]: 64→128ch, 20×20 (P5/32) ← Depth P5
#   - CT控制理论融合（层级化，自底向上传递融合信息）：
#     · P3浅层: KalmanGatedFusion(RGB_P3, Depth_P3) → 64ch
#       利用多尺度方差估计器计算局部卡尔曼增益K，动态融合RGB和Depth
#       K = sigma2_rgb / (sigma2_rgb + sigma2_dep + eps)
#       K→1时信任Depth，K→0时信任RGB
#     · P4中层: ESOFusion(RGB_P4, Fused_P3) → 96+64=160ch
#       自抗扰观测器(ESO)两步迭代估计遮挡扰动并补偿
#       输出 = cat(f_clean, f_fused_p3)，通道数 = c_p4_rgb + c_p3_fused
#     · P5深层: IDAPBCFusion(RGB_P5, Fused_P4) → 512ch
#       IDA-PBC能量成型融合，空间-通道联合势能建模
#       通道势能回答"是什么"，空间势能回答"在哪里"
#
# 融合层级关系（自底向上）：
#   KalmanGatedFusion(RGB_P3, Depth_P3) → Fused_P3 (64ch)
#   ESOFusion(RGB_P4, Fused_P3)         → Fused_P4 (160ch, 含P3信息)
#   IDAPBCFusion(RGB_P5, Fused_P4)      → Fused_P5 (512ch, 含P4信息)
# ==============================================================================

nc: 80
channels: 4  # RGB(3ch) + Depth(1ch) = 4通道输入
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB 分支 (MobileNetV4-Conv-M) ==========
  # [from, repeats, module, args]
  - [-1, 1, MobileNetV4Stem_RGB, []]      # 0-P1/2: 32ch, 320×320
  - [-1, 1, MobileNetV4Stage, [32]]        # 1-P2/4: 32ch, 160×160
  - [-1, 1, MobileNetV4Stage, [64]]        # 2-P3/8: 64ch, 80×80 ← RGB P3
  - [-1, 1, MobileNetV4Stage, [96]]        # 3-P4/16: 96ch, 40×40 ← RGB P4
  - [-1, 1, Conv, [512, 3, 2]]            # 4-P5/32: 512ch, 20×20
  - [-1, 1, SPPF, [512, 5]]               # 5-P5/32: 512ch, 20×20 ← RGB P5

  # ========== Depth 分支 (StarNet) ==========
  # 从 layer 0 分叉，StarNet提取深度特征
  - [0, 1, StarNetStem_Depth, [32]]        # 6-P3/8: 32ch, 80×80 ← Depth P3
  - [-1, 1, StarNetStage, [64, 2]]         # 7-P4/16: 64ch, 40×40 ← Depth P4
  - [-1, 1, StarNetStage, [128, 2]]        # 8-P5/32: 128ch, 20×20 ← Depth P5

  # ========== CT 控制理论融合 (层级化) ==========
  # P3浅层: 卡尔曼增益融合 (深度指导RGB)
  - [[2, 6], 1, KalmanGatedFusion, []]     # 9-P3融合: Kalman(RGB_P3, Depth_P3) → 64ch
  # P4中层: ESO扰动补偿融合 (输入RGB_P4 + Fused_P3，输出=ch[P4]+ch[P3])
  - [[3, 9], 1, ESOFusion, []]             # 10-P4融合: ESO(RGB_P4, Fused_P3) → 96+64=160ch
  # P5深层: IDA-PBC能量成型融合
  - [[5, 10], 1, IDAPBCFusion, []]         # 11-P5融合: IDAPBC(RGB_P5, Fused_P4) → 512ch

# 检测头 (适配CT融合输出通道)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12: 512ch, 40×40
  - [[-1, 10], 1, Concat, [1]]            # 13-cat ESO P4: 512+160=672ch
  - [-1, 2, C3k2, [256, False]]           # 14: 256ch

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15: 256ch, 80×80
  - [[-1, 9], 1, Concat, [1]]             # 16-cat Kalman P3: 256+64=320ch
  - [-1, 2, C3k2, [128, False]]           # 17-P3/8-small: 128ch

  - [-1, 1, Conv, [128, 3, 2]]            # 18: 128ch, 40×40
  - [[-1, 14], 1, Concat, [1]]            # 19-cat head P4: 128+256=384ch
  - [-1, 2, C3k2, [256, False]]           # 20-P4/16-medium: 256ch

  - [-1, 1, Conv, [256, 3, 2]]            # 21: 256ch, 20×20
  - [[-1, 11], 1, Concat, [1]]            # 22-cat IDAPBC P5: 256+512=768ch
  - [-1, 2, C3k2, [512, True]]            # 23-P5/32-large: 512ch

  - [[17, 20, 23], 1, Segment, [nc, 32, 256]] # 24-Segment(P3, P4, P5)
