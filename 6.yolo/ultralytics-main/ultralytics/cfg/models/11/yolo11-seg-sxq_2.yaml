# ============================================================
# YOLO11 改进版 v5 - 实例分割版
# Dense Skip + Layer-wise Attention Backbone + Segment Head
#
# 任务类型：instance segmentation（实例分割）
# Backbone：与 v5 检测版完全相同，不做任何改动
# Head：FPN+PAN 结构，检测头替换为 Segment，新增 Proto 分支
#
# Segment 模块参数：[nc, nm, npr]
#   nc  = 类别数（80 for COCO）
#   nm  = mask prototype 数量（默认32）
#   npr = Proto 中间层维度（默认256）
# ============================================================

nc: 6
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ============================================================
# Backbone（与 v5 检测版完全一致，层编号 0~37）
# ============================================================
backbone:

  # 层 0
  - [-1, 1, Conv, [64, 3, 2]]               # 0  Conv k=3 s=2 → 320×320, ch=64

  # ★ 层 1：新增 C3k2（C1，所有跳线源头）
  - [-1, 1, C3k2, [64, False]]              # 1  C3k2 → 320×320, ch=64

  # 层 2
  - [-1, 1, Conv, [128, 3, 2]]              # 2  Conv k=3 s=2 → 160×160, ch=128

  # --- W1 跳线：层1 → 阶段2 C3k2 ---
  - [1, 1, MyAdaptivePool, [2]]     # 3  Pool 320→160
  - [-1, 1, Conv, [128, 1, 1]]              # 4  W1 对齐 ch64→128
  - [-1, 1, Conv, [64, 1, 1]]               # 5  降维 ch128→64
  - [-1, 1, ScalarAttention, []]          # 6  ScalarAttn α
  - [[2, 6], 1, Concat, [1]]                # 7  Concat → ch=192
  - [-1, 2, C3k2, [128, False]]             # 8  C3k2(C2) → 160×160, ch=128

  # 层 9
  - [-1, 1, Conv, [256, 3, 2]]              # 9  Conv k=3 s=2 → 80×80, ch=256

  # --- W2 跳线：层1 → 阶段4 C3k2 ---
  - [1, 1, MyAdaptivePool, [4]]      # 10 Pool 320→80
  - [-1, 1, Conv, [256, 1, 1]]              # 11 W2 对齐 ch64→256
  - [-1, 1, Conv, [128, 1, 1]]              # 12 降维 ch256→128
  - [-1, 1, ScalarAttention, []]         # 13 ScalarAttn α
  - [[9, 13], 1, Concat, [1]]               # 14 Concat → ch=384
  - [-1, 2, C3k2, [256, False]]             # 15 C3k2(C3) → 80×80, ch=256  ← P3

  # 层 16
  - [-1, 1, Conv, [512, 3, 2]]              # 16 Conv k=3 s=2 → 40×40, ch=512

  # --- W3 跳线：层1 → 40×40 ---
  - [1, 1, MyAdaptivePool, [8]]      # 17 Pool 320→40
  - [-1, 1, Conv, [512, 1, 1]]              # 18 W3 对齐 ch64→512
  - [-1, 1, Conv, [256, 1, 1]]              # 19 降维 ch512→256
  - [-1, 1, ScalarAttention, []]         # 20 ScalarAttn α (W3)

  # --- W4 跳线：层8(C2) → 40×40 ---
  - [8, 1, MyAdaptivePool, [4]]      # 21 Pool 160→40
  - [-1, 1, Conv, [512, 1, 1]]              # 22 W4 对齐 ch128→512
  - [-1, 1, Conv, [256, 1, 1]]              # 23 降维 ch512→256
  - [-1, 1, ScalarAttention, []]         # 24 ScalarAttn α (W4)

  # --- W5 跳线：层15(C3) → 40×40 ---
  - [15, 1, MyAdaptivePool, [2]]     # 25 Pool 80→40
  - [-1, 1, Conv, [512, 1, 1]]              # 26 W5 对齐 ch256→512
  - [-1, 1, Conv, [256, 1, 1]]              # 27 降维 ch512→256
  - [-1, 1, ScalarAttention, []]         # 28 ScalarAttn α (W5)

  # --- 三路汇聚 ---
  - [[20, 24, 28], 1, Concat, [1]]          # 29 三路 Concat → ch=768
  - [-1, 1, Conv, [256, 1, 1]]              # 30 降维 ch768→256
  - [-1, 1, MyChannelAttention, []]        # 31 ChannelAttn 精筛
  - [[16, 31], 1, Concat, [1]]              # 32 Concat 主干+跳线 → ch=768
  - [-1, 2, C3k2, [512, True]]              # 33 C3k2(C5) → 40×40, ch=512  ← P4

  # 层 34
  - [-1, 1, Conv, [1024, 3, 2]]             # 34 Conv k=3 s=2 → 20×20, ch=1024
  - [-1, 2, C3k2, [1024, True]]             # 35 C3k2(C6) → 20×20, ch=1024
  - [-1, 1, SPPF, [1024, 5]]               # 36 SPPF → 20×20, ch=1024
  - [-1, 1, C2PSA, [1024]]                 # 37 C2PSA → 20×20, ch=1024  ← P5


# ============================================================
# Head（分割版）
# P3 = 层15（ch=256, 80×80）
# P4 = 层33（ch=512, 40×40）
# P5 = 层37（ch=1024, 20×20）
# ============================================================
head:

  # ----------------------------------------------------------
  # Proto 分支：生成 mask prototype（接 P3 最高分辨率特征）
  # Proto(in_ch, mid_ch, num_masks)
  # 层 38
  - [15, 1, Proto, [256, 32]]               # 38 Proto → mask prototypes (32个)
                                             #    输入 P3(ch=256)，输出供 Segment 使用
  # ----------------------------------------------------------
  # FPN 上采样路径 P5→P4→P3
  #
  # 层 39
  - [37, 1, nn.Upsample, [None, 2, "nearest"]]   # 39 P5 上采样 → 40×40

  # 层 40
  - [[-1, 33], 1, Concat, [1]]                    # 40 Concat P4(层33) → ch=1536

  # 层 41
  - [-1, 2, C3k2, [512, False]]                   # 41 C3k2 40×40, ch=512

  # 层 42
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 42 上采样 → 80×80
  # 层 43
  - [[-1, 15], 1, Concat, [1]]                    # 43 Concat P3(层15) → ch=768

  # 层 44
  - [-1, 2, C3k2, [256, False]]                   # 44 C3k2 80×80, ch=256  → P3输出

  # ----------------------------------------------------------
  # PAN 下采样路径 P3→P4→P5
  #
  # 层 45
  - [-1, 1, Conv, [256, 3, 2]]                    # 45 → 40×40

  # 层 46
  - [[-1, 41], 1, Concat, [1]]                    # 46 Concat → ch=768

  # 层 47
  - [-1, 2, C3k2, [512, False]]                   # 47 C3k2 40×40, ch=512  → P4输出

  # 层 48
  - [-1, 1, Conv, [512, 3, 2]]                    # 48 → 20×20

  # 层 49
  - [[-1, 37], 1, Concat, [1]]                    # 49 Concat P5(层37) → ch=1536

  # 层 50
  - [-1, 2, C3k2, [1024, True]]                   # 50 C3k2 20×20, ch=1024  → P5输出

  # ----------------------------------------------------------
  # 分割头：Segment(nc, nm, npr)
  #   nc  = 类别数
  #   nm  = mask prototype 数量，需与 Proto 第二参数一致（32）
  #   npr = prototype 维度（256）
  # 三尺度特征图 + Proto 原型一起送入
  # 层 51
  - [[44, 47, 50], 1, Segment, [nc, 32, 256]]     # 51 Segment(P3, P4, P5)
                                                    #    自动引用层38的 Proto 输出