# YOLO11n backbone


# Parameters
nc: 80 # number of classes (官方默认是80，训练时代码会自动根据你的草莓数据集覆盖为1)
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  # ======= 修改点开始 =======
  # 将这里原本提取深层特征的 Conv 替换为 Conv_DCN
  - [-1, 1, Conv_DCN, [512, 3, 2]] # 5-P4/16 (处理中等尺寸物体)
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv_DCN, [1024, 3, 2]] # 7-P5/32 (处理大尺寸物体及严重遮挡)
  # ======= 修改点结束 =======
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 7]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  # 21: 修改点：替换原来的 C2PSA 为 GAM 模块
  - [-1, 1, GAM, [1024]] 
  
  # 22: 修改点：在 Neck 末端额外嵌入一个 GAM 模块
  - [-1, 1, GAM, [1024]] 

  - [[15, 18, 22], 1, Segment, [nc, 32, 256]] # 23: Segment Head