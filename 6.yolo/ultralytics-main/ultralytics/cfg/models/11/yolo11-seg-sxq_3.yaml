# ============================================================
# YOLO11 改进版 v4 - 实例分割版
# 改动：Neck P3分支引入layer8浅层特征，增强小目标定位精度
# ============================================================

nc: 6
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ============================================================
# Backbone（完全不动）
# ============================================================
backbone:

  - [-1, 1, Conv, [64, 3, 2]]               # 0
  - [-1, 1, C3k2, [64, False]]              # 1  C1
  - [-1, 1, Conv, [128, 3, 2]]              # 2
  - [1, 1, MyAdaptivePool, [2]]             # 3
  - [-1, 1, Conv, [128, 1, 1]]              # 4
  - [-1, 1, Conv, [64, 1, 1]]               # 5
  - [-1, 1, ScalarAttention, []]            # 6
  - [[2, 6], 1, Concat, [1]]                # 7
  - [-1, 2, C3k2, [128, False]]             # 8  C2 ← 浅层特征来源 160×160
  - [-1, 1, Conv, [256, 3, 2]]              # 9
  - [1, 1, MyAdaptivePool, [4]]             # 10
  - [-1, 1, Conv, [256, 1, 1]]              # 11
  - [-1, 1, Conv, [128, 1, 1]]              # 12
  - [-1, 1, ScalarAttention, []]            # 13
  - [[9, 13], 1, Concat, [1]]               # 14
  - [-1, 2, C3k2, [256, False]]             # 15  C3 ← P3 80×80
  - [-1, 1, Conv, [512, 3, 2]]              # 16
  - [1, 1, MyAdaptivePool, [8]]             # 17
  - [-1, 1, Conv, [512, 1, 1]]              # 18
  - [-1, 1, Conv, [256, 1, 1]]              # 19
  - [-1, 1, ScalarAttention, []]            # 20
  - [8, 1, MyAdaptivePool, [4]]             # 21
  - [-1, 1, Conv, [512, 1, 1]]              # 22
  - [-1, 1, Conv, [256, 1, 1]]              # 23
  - [-1, 1, ScalarAttention, []]            # 24
  - [15, 1, MyAdaptivePool, [2]]            # 25
  - [-1, 1, Conv, [512, 1, 1]]              # 26
  - [-1, 1, Conv, [256, 1, 1]]              # 27
  - [-1, 1, ScalarAttention, []]            # 28
  - [[20, 24, 28], 1, Concat, [1]]          # 29
  - [-1, 1, Conv, [256, 1, 1]]              # 30
  - [-1, 1, MyChannelAttention, []]         # 31
  - [[16, 31], 1, Concat, [1]]              # 32
  - [-1, 2, C3k2, [512, True]]              # 33  C5 ← P4 40×40
  - [-1, 1, Conv, [1024, 3, 2]]             # 34
  - [-1, 2, C3k2, [1024, True]]             # 35  C6
  - [-1, 1, SPPF, [1024, 5]]               # 36
  - [-1, 1, C2PSA, [1024]]                 # 37  ← P5 20×20

# ============================================================
# Head
# P3 = layer15（ch=256, 80×80）
# P4 = layer33（ch=512, 40×40）
# P5 = layer37（ch=1024, 20×20）
# layer8 = C2（ch=128, 160×160）← 新引入的浅层特征
# ============================================================
head:

  # ----------------------------------------------------------
  # Proto分支（接P3最高分辨率特征）
  # ----------------------------------------------------------
  - [15, 1, Proto, [256, 32]]               # 38

  # ----------------------------------------------------------
  # FPN上采样：P5 → P4
  # ----------------------------------------------------------
  - [37, 1, nn.Upsample, [None, 2, "nearest"]]   # 39  20→40
  - [[-1, 33], 1, Concat, [1]]                    # 40  ch=1024+512=1536
  - [-1, 2, C3k2, [512, False]]                   # 41  40×40, ch=512

  # ----------------------------------------------------------
  # FPN上采样：P4 → P3
  # ----------------------------------------------------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 42  40→80
  - [[-1, 15], 1, Concat, [1]]                    # 43  ch=512+256=768，80×80

  # ----------------------------------------------------------
  # 新增：引入layer8浅层特征增强P3小目标定位
  # layer8实际ch = 128×0.25 = 32
  # layer43实际ch = 768×0.25 = 192
  # ----------------------------------------------------------
  - [8, 1, MyAdaptivePool, [2]]                   # 44  160→80，ch=32
  - [-1, 1, Conv, [192, 1, 1]]                    # 45  32→192，与layer43通道对齐

  # 浅层(layer45) + 深层(layer43) Concat融合
  # 浅层在前保证梯度优先流向浅层特征
  - [[45, 43], 1, Concat, [1]]                    # 46  ch=192+192=384，80×80

  # C3k2融合两路特征，自动学习各路权重
  - [-1, 2, C3k2, [256, False]]                   # 47  384→256，P3输出，80×80

  # ----------------------------------------------------------
  # PAN下采样：P3 → P4
  # ----------------------------------------------------------
  - [-1, 1, Conv, [256, 3, 2]]                    # 48  80→40
  - [[-1, 41], 1, Concat, [1]]                    # 49  ch=256+512=768
  - [-1, 2, C3k2, [512, False]]                   # 50  40×40，P4输出

  # ----------------------------------------------------------
  # PAN下采样：P4 → P5
  # ----------------------------------------------------------
  - [-1, 1, Conv, [512, 3, 2]]                    # 51  40→20
  - [[-1, 37], 1, Concat, [1]]                    # 52  ch=512+1024=1536
  - [-1, 2, C3k2, [1024, True]]                   # 53  20×20，P5输出

  # ----------------------------------------------------------
  # 分割头
  # P3=layer47, P4=layer50, P5=layer53
  # ----------------------------------------------------------
  - [[47, 50, 53], 1, Segment, [nc, 32, 256]]     # 54