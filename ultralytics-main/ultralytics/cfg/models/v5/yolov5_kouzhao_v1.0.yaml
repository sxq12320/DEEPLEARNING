# YOLOv5u 🚀 Dual-Branch for Fine-grained Mask Detection (适配 Ultralytics YOLOv8 框架)
nc: 3  # 类别数：0:戴口罩, 1:不戴口罩, 2:佩戴不正确
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple

# 【注意】：去掉了 anchors 模块，因为最新的 Ultralytics 框架是 Anchor-Free 的！

backbone:
  # [from, number, module, args]
  # --- 共享浅层特征 (Stem) ---
  - [-1, 1, Conv, [64, 6, 2, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4
  - [-1, 3, C3, [128]]            # 2 (此处开始分流)

  # --- Branch 1: Main Backbone (深层全局语义分支) ---
  - [-1, 1, Conv, [256, 3, 2]]    # 3-P3/8
  - [-1, 6, C3, [256]]            # 4 (Main P3)
  - [-1, 1, Conv, [512, 3, 2]]    # 5-P4/16
  - [-1, 9, C3, [512]]            # 6 (Main P4)
  - [-1, 1, Conv, [1024, 3, 2]]   # 7-P5/32
  - [-1, 3, C3, [1024]]           # 8 (Main P5)
  - [-1, 1, SPPF, [1024, 5]]      # 9 (Main SPPF)

  # --- Branch 2: Detail Backbone (浅层局部细节分支) ---
  - [2, 1, Conv, [128, 3, 2]]     # 10-P3/8
  - [-1, 3, C3, [128]]            # 11 (Detail P3)
  - [-1, 1, Conv, [256, 3, 2]]    # 12-P4/16
  - [-1, 3, C3, [256]]            # 13 (Detail P4)
  - [-1, 1, Conv, [512, 3, 2]]    # 14-P5/32
  - [-1, 3, C3, [512]]            # 15 (Detail P5)

  # --- Feature Fusion (特征融合层) ---
  - [[4, 11], 1, Concat, [1]]     # 16: 融合 P3 尺度
  - [[6, 13], 1, Concat, [1]]     # 17: 融合 P4 尺度
  - [[9, 15], 1, Concat, [1]]     # 18: 融合 P5 尺度

head:
  - [-1, 1, Conv, [1024, 1, 1]]   # 19
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 20
  - [[-1, 17], 1, Concat, [1]]    # 21: cat backbone P4
  - [-1, 3, C3, [512, False]]     # 22

  - [-1, 1, Conv, [512, 1, 1]]    # 23
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 24
  - [[-1, 16], 1, Concat, [1]]    # 25: cat backbone P3
  - [-1, 3, C3, [256, False]]     # 26 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]    # 27
  - [[-1, 23], 1, Concat, [1]]    # 28: cat head P4
  - [-1, 3, C3, [512, False]]     # 29 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]    # 30
  - [[-1, 19], 1, Concat, [1]]    # 31: cat head P5
  - [-1, 3, C3, [1024, False]]    # 32 (P5/32-large)

  - [[26, 29, 32], 1, Detect, [nc]]  # 33: Detect(P3, P4, P5)