# yolo11-ct-AB.yaml (消融组 A+B：卡尔曼 + ESO 扰动补偿)
# 逻辑说明：同时激活 P3 卡尔曼融合与 P4 ESO 自抗扰融合，深层保持 Bypass。

# Parameters
nc: 80 # number of classes
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # RGB 流
  - [-1, 1, Conv, [64, 3, 2]]  # 0
  - [-1, 1, C3k2, [128, False, 0.25]]  # 1
  - [-1, 1, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, C3k2, [512, False, 0.25]]  # 3
  - [-1, 1, C3k2, [512, True, 0.25]]   # 4

  # Depth 流
  - [-1, 1, Conv, [16, 3, 2]]  # 5
  - [-1, 1, C3k2, [32, False, 0.25]]  # 6
  - [-1, 1, C3k2, [64, False, 0.25]]  # 7

  # 阶段 1 & 2 激活
  - [[2, 7], 1, KalmanGatedFusion, []]  # 8 - F_Fused_P3_Kalman (激活 A)
  - [[3, 8], 1, ESOFusion, []]          # 9 - F_Fused_P4_ESO (激活 B)
  
  # 深层保持 Bypass 对照
  - [[4, 9], 1, BypassModule, [512]]    # 10

head:
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 1, C2PSA, [1024]] # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 9], 1, Concat, [1]] # 14 cat backbone P4
  - [-1, 1, C3k2, [512, False]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 8], 1, Concat, [1]] # 17 cat backbone P3
  - [-1, 1, C3k2, [256, False]] # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20 cat head P4
  - [-1, 1, C3k2, [512, False]] # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 cat head P5
  - [-1, 1, C3k2, [1024, True]] # 24 (P5/32-large)

  - [[18, 21, 24], 1, Segment, [nc, 32, 256]] # 25 Detect/Segment(P3, P4, P5)