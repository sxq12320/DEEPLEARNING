# Ultralytics YOLO11 + LSNet-T backbone
# LSNet: See Large, Focus Small (CVPR 2025)
# https://github.com/THU-MIG/lsnet / https://arxiv.org/abs/2503.23135
#
# LSNet-T: depths=[2,2,4,2]  channels=[64,128,256,512]
#  ~11.4M params (backbone only @ 224²)

# Parameters
nc: 80 # number of classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# LSNet-T backbone (4-stage: H/4 -> H/8(P3) -> H/16(P4) -> H/32(P5))
backbone:
  # Stem: overlapping patch embedding  H/4
  - [-1, 1, PatchEmbed, [64, 4]]          # 0

  # Stage 1: LS blocks  H/4
  - [-1, 2, LSBlock, [64]]                # 1

  # Down  H/4 -> H/8
  - [-1, 1, LSNetDownsample, [128]]       # 2

  # Stage 2: LS blocks  H/8  (P3 feature)
  - [-1, 2, LSBlock, [128]]               # 3

  # Down  H/8 -> H/16
  - [-1, 1, LSNetDownsample, [256]]       # 4

  # Stage 3: LS blocks  H/16  (P4 feature)
  - [-1, 4, LSBlock, [256]]               # 5

  # Down  H/16 -> H/32
  - [-1, 1, LSNetDownsample, [512]]       # 6

  # Stage 4: MSA blocks  H/32  (P5 feature)
  - [-1, 2, MSAStageBlock, [512]]         # 7

  # SPPF + C2PSA on P5
  - [-1, 1, SPPF, [512, 5]]               # 8
  - [-1, 2, C2PSA, [512]]                 # 9

# YOLO11 head (FPN + Detect)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]             # cat backbone P4
  - [-1, 2, C3k2, [256, False]]           # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]             # cat backbone P3
  - [-1, 2, C3k2, [128, False]]           # 15 (P3/8-small)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]            # cat head P4
  - [-1, 2, C3k2, [256, False]]           # 18 (P4/16-medium)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]             # cat head P5
  - [-1, 2, C3k2, [512, True]]            # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]       # Detect(P3, P4, P5)
