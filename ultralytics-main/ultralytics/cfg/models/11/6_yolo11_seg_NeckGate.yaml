# ============================================================
# YOLO11 改进版 v6 - NeckGateFusion 版
# Dense Skip + C3K2_LS Backbone + NeckGateFusion Head
#
# 任务类型：instance segmentation（实例分割）
# Backbone：Dense Skip + C3K2_LS（与 v5 相同）
# Head：FPN+PAN 结构，Neck 中 C3k2 替换为 C3k2_Neck（含门控融合）
#
# Segment 模块参数：[nc, nm, npr]
#   nc  = 类别数（80 for COCO）
#   nm  = mask prototype 数量（默认32）
#   npr = Proto 中间层维度（默认256）
# ============================================================

nc: 80
ch: 4
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ============================================================
# Backbone（与 v5 检测版完全一致，层编号 0~37）
# ============================================================
backbone:

  # 层 0
  - [-1, 1, Conv, [64, 3, 2]]               # 0  Conv k=3 s=2 → 320×320, ch=64

  # ★ 层 1：新增 C3K2_LS（C1，所有跳线源头）
  - [-1, 1, C3k2_LS, [64, False]]              # 1  C3K2_LS → 320×320, ch=64

  # 层 2
  - [-1, 1, Conv, [128, 3, 2]]              # 2  Conv k=3 s=2 → 160×160, ch=128

  # --- W1 跳线：层1 → 阶段2 C3K2_LS ---
  - [1, 1, MyAdaptivePool, [2]]     # 3  Pool 320→160
  - [-1