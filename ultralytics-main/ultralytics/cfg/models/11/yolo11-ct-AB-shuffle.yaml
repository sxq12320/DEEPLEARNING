# yolo11-ct-AB-shuffle.yaml (消融组 A+B + ShuffleNetV2 Depth 流)
# 逻辑说明：同时激活 P3 卡尔曼融合与 P4 ESO 自抗扰融合，深层保持 Bypass。
# 对比: yolo11-ct-AB.yaml (原始 Conv Depth 流) vs 本配置 (ShuffleNetV2 Depth 流)

# Parameters
nc: 1 # number of classes (Apple Amodal)
channels: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, nn.Identity, []]            # 0

  # ================= RGB 流 (与 ct-AB 完全一致) =================
  - [0, 1, SplitChannels, [[0, 1, 2]]]  # 1
  - [-1, 1, Conv, [64, 3, 2]]           # 2
  - [-1, 1, Conv, [128, 3, 2]]          # 3
  - [-1, 1, C3k2, [256, False, 0.25]]   # 4 - P3 (RGB) 160×160
  - [-1, 1, Conv, [256, 3, 2]]          # 5
  - [-1, 1, C3k2, [512, False, 0.25]]   # 6 - P4 (RGB) 80×80
  - [-1, 1, Conv, [512, 3, 2]]          # 7
  - [-1, 1, C3k2, [512, True, 0.25]]    # 8 - P5 (RGB) 40×40

  # ================= Depth 流 (ShuffleNetV2 1.0x) =================
  - [0, 1, SplitChannels, [[3]]]        # 9
  - [-1, 1, ShuffleV2Stem_Depth, []]     # 10 - Stem: 24ch, 160×160
  - [-1, 1, ShuffleV2Stage, [116, 4]]    # 11 - Stage2: 116ch, 80×80
  - [-1, 1, ShuffleV2Stage, [232, 8]]    # 12 - Stage3: 232ch, 40×40

  # ================= 阶段 1 & 2 激活 =================
  - [[4, 10], 1, KalmanGatedFusion, []]  # 13 - F_P3 (A: 卡尔曼) 160×160
  - [[6, 11], 1, ESOFusion, []]          # 14 - F_P4 (B: ESO) 80×80 → 输出 128+116=244ch
  - [[8, 12], 1, BypassModule, []]       # 15 - F_P5 (40×40)

head:
  - [-1, 1, SPPF, [512, 5]]             # 16
  - [-1, 1, C2PSA, [512]]               # 17
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 14], 1, Concat, [1]]          # 19 - Concat with ESOFusion output (244ch)
  - [-1, 1, C3k2, [512, False]]         # 20
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21
  - [[-1, 13], 1, Concat, [1]]          # 22
  - [-1, 1, C3k2, [256, False]]         # 23
  - [-1, 1, Conv, [256, 3, 2]]          # 24
  - [[-1, 20], 1, Concat, [1]]          # 25
  - [-1, 1, C3k2, [512, False]]         # 26
  - [-1, 1, Conv, [512, 3, 2]]          # 27
  - [[-1, 17], 1, Concat, [1]]          # 28
  - [-1, 1, C3k2, [512, False]]          # 29
  - [[23, 26, 29], 1, Segment, [nc, 32, 256]]  # 30 - 检测与分割输出
