# ============================================================
# YOLO11 改进版 v6 - NeckGateFusion 门控融合版
# Dense Skip + C3K2_LS Backbone + C3k2_Neck 门控Neck
#
# 改进点：
#   1. Backbone 保持 v5 最佳配置（Dense Skip + C3K2_LS）
#   2. Neck 中所有 C3k2 替换为 C3k2_Neck（内部使用 NeckGateFusion）
#   3. 门控机制自适应加权两路特征，替代简单 chunk+cat
#
# 任务类型：instance segmentation
# ============================================================

nc: 80
ch: 4
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ============================================================
# Backbone（与 v5 完全一致，层 0~37）
# ============================================================
backbone:
  # 层 0
  - [-1, 1, Conv, [64, 3, 2]]

  # ★ 层 1：C3K2_LS（所有跳线源头）
  - [-1, 1, C3k2_LS, [64, False]]

  # 层 2
  - [-1, 1, Conv, [128, 3, 2]]

  # --- W1 跳线：层1 → 阶段2 ---
  - [1, 1, MyAdaptivePool, [2]]
  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, Conv, [64, 1, 1]]
  - [-1, 1, ScalarAttention, []]
  - [[2, 6], 1, Concat, [1]]
  - [-1, 2, C3k2_LS, [128, False]]

  # 层 9
  - [-1, 1, Conv, [256, 3, 2]]

  # --- W2 跳线：层1 → 阶段4 ---
  - [1, 1, MyAdaptivePool, [4]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, ScalarAttention, []]
  - [[9, 13], 1, Concat, [1]]
  - [-1, 2, C3k2_LS, [256, False]]

  # 层 16
  - [-1, 1, Conv, [512, 3, 2]]

  # --- W3 跳线：层1 → 40×40 ---
  - [1, 1, MyAdaptivePool, [8]]
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, ScalarAttention, []]

  # --- W4 跳线：层8 → 40×40 ---
  - [8, 1, MyAdaptivePool, [4]]
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, ScalarAttention, []]

  # --- W5 跳线：层15 → 40×40 ---
  - [15, 1, MyAdaptivePool, [2]]
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, ScalarAttention, []]

  # --- 三路汇聚 ---
  - [[20, 24, 28], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, MyChannelAttention, []]
  - [[16, 31], 1, Concat, [1]]
  - [-1, 2, C3k2_LS, [512, True]]

  # 层 34
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2_LS, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, C2PSA, [1024]]


# ============================================================
# Head（Neck 改进版：C3k2 → C3k2_Neck）
# ============================================================
head:
  # Proto 分支
  - [15, 1, Proto, [256, 32]]

  # ----------------------------------------------------------
  # FPN 上采样路径 P5→P4→P3
  # ----------------------------------------------------------
  - [37, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 33], 1, Concat, [1]]
  - [-1, 2, C3k2_Neck, [512, False]]    # ★ 门控融合

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 2, C3k2_Neck, [256, False]]    # ★ 门控融合

  # ----------------------------------------------------------
  # PAN 下采样路径 P3→P4→P5
  # ----------------------------------------------------------
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 41], 1, Concat, [1]]
  - [-1, 2, C3k2_Neck, [512, False]]    # ★ 门控融合

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 37], 1, Concat, [1]]
  - [-1, 2, C3k2_Neck, [1024, True]]    # ★ 门控融合

  # ----------------------------------------------------------
  # 分割头
  - [[44, 47, 50], 1, Segment, [nc, 32, 256]]
