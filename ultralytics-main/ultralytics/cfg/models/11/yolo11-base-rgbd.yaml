# YOLO11-Base-RGBD (对照组：Base 基础非对称双流模型)
# 逻辑说明：使用最简单的 Bypass 通道拼接，作为对照基准线，无任何控制理论计算。
# RGB 主干为标准 YOLO11 结构（Conv+C3k2 逐级下采样），Depth 流用轻量 Conv 逐级下采样对齐空间尺寸。

# Parameters
nc: 80 # number of classes
channels: 4 # RGBD 输入：RGB(3ch) + Depth(1ch)
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # 保留原始 4ch 输入
  - [-1, 1, nn.Identity, []]            # 0 - 原始输入 (B, 4, H, W)

  # RGB 流：标准 YOLO11 主干 (Conv stride=2 逐级下采样 + C3k2)
  - [0, 1, SplitChannels, [[0, 1, 2]]]  # 1 - SplitRGB → (B, 3, H, W)
  - [-1, 1, Conv, [64, 3, 2]]           # 2 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 3 - P2/4
  - [-1, 1, C3k2, [256, False, 0.25]]   # 4 - P3/8 (RGB)
  - [-1, 1, Conv, [256, 3, 2]]          # 5
  - [-1, 1, C3k2, [512, False, 0.25]]   # 6 - P4/16 (RGB)
  - [-1, 1, Conv, [512, 3, 2]]          # 7
  - [-1, 1, C3k2, [512, True, 0.25]]    # 8 - P5/32 (RGB)

  # Depth 流：轻量 Conv 逐级下采样，与 RGB 各阶段空间尺寸对齐
  - [0, 1, SplitChannels, [[3]]]        # 9 - SplitDepth → (B, 1, H, W)
  - [-1, 1, Conv, [16, 3, 2]]           # 10 - P1/2 (Depth)
  - [-1, 1, Conv, [64, 3, 2]]           # 11 - P3/8 (Depth, 与 RGB P3 同尺寸)
  - [-1, 1, Conv, [128, 3, 2]]          # 12 - P4/16 (Depth, 与 RGB P4 同尺寸)
  - [-1, 1, Conv, [128, 3, 2]]          # 13 - P5/32 (Depth, 与 RGB P5 同尺寸)

  # 基础无损融合 (Bypass，无控制增益)
  - [[4, 11], 1, BypassModule, []]      # 14 - F_P3
  - [[6, 12], 1, BypassModule, []]      # 15 - F_P4
  - [[8, 13], 1, BypassModule, []]      # 16 - F_P5

head:
  - [-1, 1, SPPF, [1024, 5]]            # 17
  - [-1, 1, C2PSA, [1024]]              # 18
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19
  - [[-1, 15], 1, Concat, [1]]          # 20 cat backbone P4
  - [-1, 1, C3k2, [512, False]]         # 21

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 22
  - [[-1, 14], 1, Concat, [1]]          # 23 cat backbone P3
  - [-1, 1, C3k2, [256, False]]         # 24 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]          # 25
  - [[-1, 21], 1, Concat, [1]]          # 26 cat head P4
  - [-1, 1, C3k2, [512, False]]         # 27 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]          # 28
  - [[-1, 18], 1, Concat, [1]]          # 29 cat head P5
  - [-1, 1, C3k2, [1024, True]]         # 30 (P5/32-large)

  - [[24, 27, 30], 1, Segment, [nc, 32, 256]]  # 31
