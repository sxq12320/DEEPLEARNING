# YOLO11-Base-RGBD (对照组：Base 基础非对称双流模型)
# 逻辑说明：使用最简单的 Bypass 通道拼接，作为对照基准线，无任何控制理论计算。

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  # RGB 流 (0 ~ 4)
  - [-1, 1, Conv, [64, 3, 2]]  # 0 - P1/2 (RGB)
  - [-1, 1, C3k2, [128, False, 0.25]]  # 1 - P2/4 (RGB)
  - [-1, 1, C3k2, [256, False, 0.25]]  # 2 - P3/8 (RGB)
  - [-1, 1, C3k2, [512, False, 0.25]]  # 3 - P4/16 (RGB)
  - [-1, 1, C3k2, [512, True, 0.25]]   # 4 - P5/32 (RGB)

  # Depth 流 (仅到 P3，减少大量参数量)
  - [-1, 1, Conv, [16, 3, 2]]  # 5 - P1/2 (Depth)
  - [-1, 1, C3k2, [32, False, 0.25]]  # 6 - P2/4 (Depth)
  - [-1, 1, C3k2, [64, False, 0.25]]  # 7 - P3/8 (Depth)

  # 基础拼接无损融合 (使用 Bypass 模块，无控制增益)
  - [[2, 7], 1, BypassModule, [64]]  # 8 - F_P3_Concat (作为阶段1对照)
  - [[3, 8], 1, BypassModule, [256]] # 9 - F_P4_Concat (作为阶段2对照)
  - [[4, 9], 1, BypassModule, [512]] # 10 - F_P5_Concat (作为阶段3对照)

head:
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 1, C2PSA, [1024]] # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 9], 1, Concat, [1]] # 14 cat backbone P4
  - [-1, 1, C3k2, [512, False]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 8], 1, Concat, [1]] # 17 cat backbone P3
  - [-1, 1, C3k2, [256, False]] # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20 cat head P4
  - [-1, 1, C3k2, [512, False]] # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 cat head P5
  - [-1, 1, C3k2, [1024, True]] # 24 (P5/32-large)

  - [[18, 21, 24], 1, Segment, [nc, 32, 256]] # 25 Detect/Segment(P3, P4, P5)