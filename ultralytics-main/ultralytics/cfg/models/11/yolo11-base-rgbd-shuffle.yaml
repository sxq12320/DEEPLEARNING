# yolo11-base-rgbd-shuffle.yaml
# 基线配置 (Bypass 无损融合) + ShuffleNetV2 1.0x 替换 Depth 流
# 对比: yolo11-base-rgbd.yaml (原始 Conv Depth 流) vs 本配置 (ShuffleNetV2 Depth 流)

# Parameters
nc: 1 # number of classes (Apple Amodal)
channels: 4 # RGBD 输入：RGB(3ch) + Depth(1ch)
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # 保留原始 4ch 输入
  - [-1, 1, nn.Identity, []]            # 0 - 原始输入 (B, 4, 640, 640)

  # ================= RGB 流 (标准 YOLO11 逐级下采样，与 base-rgbd 完全一致) =================
  - [0, 1, SplitChannels, [[0, 1, 2]]]  # 1 - SplitRGB → (B, 3, 640, 640)
  - [-1, 1, Conv, [64, 3, 2]]           # 2 - P1/2 (320x320)
  - [-1, 1, Conv, [128, 3, 2]]          # 3 - P2/4 (160x160)
  - [-1, 1, C3k2, [256, False, 0.25]]   # 4 - 特征提取 (160x160)
  - [-1, 1, Conv, [256, 3, 2]]          # 5 - P3/8 (80x80)
  - [-1, 1, C3k2, [512, False, 0.25]]   # 6 - 特征提取 (80x80)
  - [-1, 1, Conv, [512, 3, 2]]          # 7 - P4/16 (40x40)
  - [-1, 1, C3k2, [512, False, 0.25]]   # 8 - 特征提取 (40x40)
  - [-1, 1, Conv, [1024, 3, 2]]         # 9 - P5/32 (20x20)
  - [-1, 1, C3k2, [1024, True]]         # 10 - 特征提取 (20x20)

  # ================= Depth 流 (ShuffleNetV2 1.0x 替换原始 Conv 层) =================
  # ShuffleNetV2 1.0x 通道: stem→24, stage2→116, stage3→232, stage4→464
  # 空间对齐: stem 160×160, stage2 80×80, stage3 40×40, stage4 20×20
  - [0, 1, SplitChannels, [[3]]]        # 11 - SplitDepth → (B, 1, 640, 640)
  - [-1, 1, ShuffleV2Stem_Depth, []]     # 12 - Stem: Conv(1→24,s=2) + MaxPool(s=2) → 24ch, 160×160
  - [-1, 1, ShuffleV2Stage, [116, 4]]    # 13 - Stage2: 4 blocks → 116ch, 80×80  (对齐 RGB P3/8)
  - [-1, 1, ShuffleV2Stage, [232, 8]]    # 14 - Stage3: 8 blocks → 232ch, 40×40 (对齐 RGB P4/16)
  - [-1, 1, ShuffleV2Stage, [464, 4]]    # 15 - Stage4: 4 blocks → 464ch, 20×20 (对齐 RGB P5/32)

  # ================= 基础无损融合 (Bypass 拼接) =================
  - [[6, 13], 1, BypassModule, []]      # 16 - F_P3 (80×80):  RGB 128ch + ShuffleV2 116ch → 128ch
  - [[8, 14], 1, BypassModule, []]      # 17 - F_P4 (40×40):  RGB 128ch + ShuffleV2 232ch → 128ch
  - [[10, 15], 1, BypassModule, []]     # 18 - F_P5 (20×20):  RGB 256ch + ShuffleV2 464ch → 256ch

head:
  - [18, 1, SPPF, [1024, 5]]            # 19 - 接收 F_P5 (20x20)
  - [-1, 1, C2PSA, [1024]]              # 20 - 自注意力在 20x20 上计算
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21 (20x20 → 40x40)
  - [[-1, 17], 1, Concat, [1]]          # 22 融合 F_P4
  - [-1, 1, C3k2, [512, False]]         # 23

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 24 (40x40 → 80x80)
  - [[-1, 16], 1, Concat, [1]]          # 25 融合 F_P3
  - [-1, 1, C3k2, [256, False]]         # 26 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]          # 27 (80x80 → 40x40)
  - [[-1, 23], 1, Concat, [1]]          # 28 融合 Head P4
  - [-1, 1, C3k2, [512, False]]         # 29 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]          # 30 (40x40 → 20x20)
  - [[-1, 20], 1, Concat, [1]]          # 31 融合 Head P5
  - [-1, 1, C3k2, [1024, False]]         # 32 (P5/32-large)

  - [[26, 29, 32], 1, Segment, [nc, 32, 256]]  # 33 检测与分割输出
