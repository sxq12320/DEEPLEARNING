# yolo11-ct-A-shuffle.yaml (消融组 A + ShuffleNetV2 Depth 流)
# 逻辑说明：仅激活 P3 阶段卡尔曼控制单元，中深层依然使用无源 Bypass。
# 对比: yolo11-ct-A.yaml (原始 Conv Depth 流) vs 本配置 (ShuffleNetV2 Depth 流)

# Parameters
nc: 1 # number of classes (Apple Amodal)
channels: 4 # RGBD 输入：RGB(3ch) + Depth(1ch)
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, nn.Identity, []]            # 0 - 原始输入 (B, 4, H, W)

  # ================= RGB 流 (与 ct-A 完全一致) =================
  - [0, 1, SplitChannels, [[0, 1, 2]]]  # 1
  - [-1, 1, Conv, [64, 3, 2]]           # 2
  - [-1, 1, Conv, [128, 3, 2]]          # 3
  - [-1, 1, C3k2, [256, False, 0.25]]   # 4 - P3 (RGB) 160×160
  - [-1, 1, Conv, [256, 3, 2]]          # 5
  - [-1, 1, C3k2, [512, False, 0.25]]   # 6 - P4 (RGB) 80×80
  - [-1, 1, Conv, [512, 3, 2]]          # 7
  - [-1, 1, C3k2, [512, True, 0.25]]    # 8 - P5 (RGB) 40×40

  # ================= Depth 流 (ShuffleNetV2 1.0x) =================
  # ShuffleNetV2 1.0x 通道: stem→24, stage2→116, stage3→232
  # 空间对齐: stem 160×160, stage2 80×80, stage3 40×40
  - [0, 1, SplitChannels, [[3]]]        # 9
  - [-1, 1, ShuffleV2Stem_Depth, []]     # 10 - Stem: 24ch, 160×160 (对齐 RGB P3)
  - [-1, 1, ShuffleV2Stage, [116, 4]]    # 11 - Stage2: 116ch, 80×80  (对齐 RGB P4)
  - [-1, 1, ShuffleV2Stage, [232, 8]]    # 12 - Stage3: 232ch, 40×40 (对齐 RGB P5)

  # ================= 阶段 1 激活：卡尔曼自适应滤波 =================
  - [[4, 10], 1, KalmanGatedFusion, []]  # 13 - F_P3 (160×160): RGB 64ch + ShuffleV2 24ch → 64ch
  # 后续保持 Bypass 对照
  - [[6, 11], 1, BypassModule, []]       # 14 - F_P4 (80×80):  RGB 128ch + ShuffleV2 116ch → 128ch
  - [[8, 12], 1, BypassModule, []]       # 15 - F_P5 (40×40):  RGB 128ch + ShuffleV2 232ch → 128ch

head:
  - [-1, 1, SPPF, [512, 5]]             # 16
  - [-1, 1, C2PSA, [512]]               # 17
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 14], 1, Concat, [1]]          # 19
  - [-1, 1, C3k2, [512, False]]         # 20
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21
  - [[-1, 13], 1, Concat, [1]]          # 22
  - [-1, 1, C3k2, [256, False]]         # 23
  - [-1, 1, Conv, [256, 3, 2]]          # 24
  - [[-1, 20], 1, Concat, [1]]          # 25
  - [-1, 1, C3k2, [512, False]]         # 26
  - [-1, 1, Conv, [512, 3, 2]]          # 27
  - [[-1, 17], 1, Concat, [1]]          # 28
  - [-1, 1, C3k2, [512, False]]          # 29
  - [[23, 26, 29], 1, Segment, [nc, 32, 256]]  # 30 - 检测与分割输出
