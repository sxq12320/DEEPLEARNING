# yolo11-ct-A.yaml (消融组 A：仅包含浅层卡尔曼融合)
# 逻辑说明：仅激活 P3 阶段卡尔曼控制单元，中深层依然使用无源 Bypass。

# Parameters
nc: 80 # number of classes
channels: 4 # RGBD 输入：RGB(3ch) + Depth(1ch)
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, nn.Identity, []]            # 0 - 原始输入 (B, 4, H, W)

  # RGB 流
  - [0, 1, SplitChannels, [[0, 1, 2]]]  # 1
  - [-1, 1, Conv, [64, 3, 2]]           # 2
  - [-1, 1, Conv, [128, 3, 2]]          # 3
  - [-1, 1, C3k2, [256, False, 0.25]]   # 4 - P3/8 (RGB)
  - [-1, 1, Conv, [256, 3, 2]]          # 5
  - [-1, 1, C3k2, [512, False, 0.25]]   # 6 - P4/16 (RGB)
  - [-1, 1, Conv, [512, 3, 2]]          # 7
  - [-1, 1, C3k2, [512, True, 0.25]]    # 8 - P5/32 (RGB)

  # Depth 流
  - [0, 1, SplitChannels, [[3]]]        # 9
  - [-1, 1, Conv, [16, 3, 2]]           # 10 - P1/2 (Depth)
  - [-1, 1, Conv, [64, 3, 2]]           # 11 - P3/8 (Depth)
  - [-1, 1, Conv, [128, 3, 2]]          # 12 - P4/16 (Depth)
  - [-1, 1, Conv, [128, 3, 2]]          # 13 - P5/32 (Depth)

  # 阶段 1 激活：卡尔曼自适应滤波
  - [[4, 11], 1, KalmanGatedFusion, []]  # 14 - F_P3 (激活 A)
  # 后续保持 Bypass 对照
  - [[6, 12], 1, BypassModule, []]       # 15 - F_P4
  - [[8, 13], 1, BypassModule, []]       # 16 - F_P5

head:
  - [-1, 1, SPPF, [1024, 5]]            # 17
  - [-1, 1, C2PSA, [1024]]              # 18
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19
  - [[-1, 15], 1, Concat, [1]]          # 20
  - [-1, 1, C3k2, [512, False]]         # 21
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 22
  - [[-1, 14], 1, Concat, [1]]          # 23
  - [-1, 1, C3k2, [256, False]]         # 24
  - [-1, 1, Conv, [256, 3, 2]]          # 25
  - [[-1, 21], 1, Concat, [1]]          # 26
  - [-1, 1, C3k2, [512, False]]         # 27
  - [-1, 1, Conv, [512, 3, 2]]          # 28
  - [[-1, 18], 1, Concat, [1]]          # 29
  - [-1, 1, C3k2, [1024, True]]         # 30
  - [[24, 27, 30], 1, Segment, [nc, 32, 256]]  # 31
