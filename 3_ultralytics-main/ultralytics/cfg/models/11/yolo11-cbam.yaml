# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs

# Parameters
nc: 80 # number of classes
scales: 
  n: [0.50, 0.25, 1024] 
  s: [0.50, 0.50, 1024] 
  m: [0.50, 1.00, 512] 
  l: [1.00, 1.00, 512] 
  x: [1.00, 1.50, 512] 

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  (后续 Concat 需要用到它)
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]  # 6  (后续 Concat 需要用到它)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  
  # --- 新增的 CBAM 层 ---
  - [-1, 1, MyCBAM, [1024]]       # 9 (原先的 SPPF 是 9，现在 CBAM 占了 9)
  
  - [-1, 1, SPPF, [1024, 5]]    # 10 (索引顺延加1)
  - [-1, 2, C2PSA, [1024]]      # 11 (索引顺延加1，这是 Backbone 的最后一层)

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]]   # 13 (连接主干的 6 层，因为 6 在 CBAM 之前，所以不变)
  - [-1, 2, C3k2, [512, False]] # 14 

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]]   # 16 (连接主干的 4 层，同样不变)
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]  # 18
  - [[-1, 14], 1, Concat, [1]]  # 19 <-- 修改这里！原来是 13，现在顺延变成了 14
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]  # 21
  - [[-1, 11], 1, Concat, [1]]  # 22 <-- 修改这里！原来连接主干尾部是 10，现在变成了 11
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # 24 <-- 修改这里！Detect 层接收的三个输出层全部加 1 (原为 16, 19, 22)