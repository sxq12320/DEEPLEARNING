# YOLO11-seg 深度可分离卷积 + 4-Head 微小目标检测魔改版

nc: 80 # number of classes
scales: 
  n: [0.50, 0.25, 1024] 

# ----------------- Backbone -----------------
backbone:
  # [from, repeats, module, args]
  - [-1, 1, DSConv, [64, 3, 2]]   # 0-P1/2  (使用 DSConv 轻量化)
  - [-1, 1, DSConv, [128, 3, 2]]  # 1-P2/4  <-- 【关键点】这是我们要提取的极小目标高分辨率特征
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, DSConv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, DSConv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]    # 6
  - [-1, 1, DSConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]   # 8
  - [-1, 1, SPPF, [1024, 5]]      # 9
  - [-1, 2, C2PSA, [1024]]        # 10

# ----------------- Neck & Head -----------------
head:
  # --- 1. FPN 自顶向下 (融合全局语义) ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13 

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (这是原本最小的 P3 层)

  # 👇【新增】继续往上采样，去拥抱 P2 层！
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 把 P3 放大到 160x160
  - [[-1, 2], 1, Concat, [1]] # 18 完美！此时都是 160x160，和 Backbone 的 P2 (层号2) Concat
  - [-1, 2, C3k2, [128, False]] # 19 --> 🌟 输出【微小目标 P2 特征】🌟

  # --- 2. PAN 自底向上 (传递定位信息) ---
  # 👇【新增】从 P2 层开始往下沉
  - [-1, 1, DSConv, [128, 3, 2]] # 20 (使用 DSConv 下采样 P2 到 P3 尺寸)
  - [[-1, 16], 1, Concat, [1]] # 21 cat FPN的 P3
  - [-1, 2, C3k2, [256, False]] # 22 --> 🌟 输出【小目标 P3 特征】🌟

  - [-1, 1, DSConv, [256, 3, 2]] # 23 (使用 DSConv 下采样)
  - [[-1, 13], 1, Concat, [1]] # 24 cat FPN的 P4
  - [-1, 2, C3k2, [512, False]] # 25 --> 🌟 输出【中目标 P4 特征】🌟

  - [-1, 1, DSConv, [512, 3, 2]] # 26 (使用 DSConv 下采样)
  - [[-1, 10], 1, Concat, [1]] # 27 cat FPN的 P5
  - [-1, 2, C3k2, [1024, True]] # 28 --> 🌟 输出【大目标 P5 特征】🌟

  # --- 3. 最终预测头 ---
  # 将 4 个不同尺度的特征图全部送入分割头
  - [[19, 22, 25, 28], 1, Segment, [nc, 32, 256]] # 29